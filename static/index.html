const STUDENT_ID = 'default_student';

const SUBJECT_FROM_NAME = {
  '物理': 'phys', '数学': 'math', '语文': 'cn',
  '英语': 'en',   '化学': 'chem', '生物': 'bio',
};

async function apiGet(path) {
  const r = await fetch(path, { headers: { 'X-Student-Id': STUDENT_ID } });
  if (!r.ok) throw new Error('GET ' + path + ' => ' + r.status);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Student-Id': STUDENT_ID },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('POST ' + path + ' => ' + r.status);
  return r.json();
}
async function apiUpload(formData) {
  const r = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'X-Student-Id': STUDENT_ID },
    body: formData,
  });
  if (!r.ok) throw new Error('upload => ' + r.status);
  return r.json();
}

function mapGradingResult(data) {
  const g = data.grading || {};
  const kps = Array.isArray(data.knowledge_points) ? data.knowledge_points : [];
  const isOk = g.is_correct === true;
  const ratio = parseFloat(g.score || 0) / Math.max(parseFloat(g.max_score || 1), 0.001);
  const verdict = isOk ? 'correct' : ratio > 0 ? 'partial' : 'wrong';
  const weakPoints = isOk ? [] :
    kps.map(k => k.name || k.knowledge_point_name || k.knowledge_point_id || '').filter(Boolean).slice(0, 3);
  const questions = [{
    q: 'AI 自动识别题目',
    yourAnswer: g.student_answer || '（未作答）',
    correctAnswer: g.correct_answer || '（无）',
    correct: isOk,
    explanation: g.feedback || g.mistake_reason || '暂无详细解析',
  }];
  return {
    verdict,
    score: isOk ? 1 : 0,
    total: 1,
    weakPoints: weakPoints.length ? weakPoints : (isOk ? [] : ['待分析']),
    questions,
  };
}
// ─── API 层结束 ───────────────────────────────────────────────────────────────

// ═══════════════════════════════════════════════════════════
// Page 2 — 知识库（物理 · 知识图谱）
// ═══════════════════════════════════════════════════════════
function PhysicsGraphPage() {
  const [sel, setSel] = useState(null);
  const svgRef = useRef(null);
  const nodesById = useMemo(() => Object.fromEntries(PHYS_NODES.map(n => [n.id, n])), []);

  const relatedIds = useMemo(() => {
    if (!sel) return null;
    const ids = new Set([sel]);
    PHYS_EDGES.forEach(([a, b]) => { if (a === sel) ids.add(b); if (b === sel) ids.add(a); });
    return ids;
  }, [sel]);

  useEffect(() => {
    let raf;
    const start = performance.now();
    function tick(now) {
      const t = (now - start) / 1000;
      const svg = svgRef.current;
      if (!svg) return;
      const offsets = {};
      PHYS_NODES.forEach((n, i) => {
        const dx = Math.sin(t * 0.45 + i * 0.7) * 1.0, dy = Math.cos(t * 0.38 + i * 1.1) * 1.0;
        offsets[n.id] = [dx, dy];
        const g = svg.querySelector(`[data-nid="${n.id}"]`);
        if (g) g.style.transform = `translate(${(n.x + dx).toFixed(2)}px, ${(n.y + dy).toFixed(2)}px)`;
      });
      PHYS_EDGES.forEach(([a, b], i) => {
        const ln = svg.querySelector(`[data-eid="${i}"]`);
        if (!ln) return;
        const A = nodesById[a], B = nodesById[b];
        const [adx, ady] = offsets[a], [bdx, bdy] = offsets[b];
        ln.setAttribute('x1', A.x + adx); ln.setAttribute('y1', A.y + ady);
        ln.setAttribute('x2', B.x + bdx); ln.setAttribute('y2', B.y + bdy);
      });
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [nodesById]);

  const PHYS_COLOR = '#8DCED4';
  return (
    <div className="page-scroll" style={{ flex: 1, overflowY: 'auto', padding: '0 0 8px' }}>
      <div style={{ padding: '0 22px 10px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700, background: PHYS_COLOR, color: '#fff' }}>物理</div>
        <div style={{ fontSize: 12.5, color: '#8A8B93' }}>{PHYS_NODES.length - 1} 个知识点 · {PHYS_EDGES.length} 条关联</div>
        <div style={{ marginLeft: 'auto', fontSize: 11.5, color: '#9CA0A8' }}>点击节点查看详情</div>
      </div>
      <div style={{ position: 'relative', margin: '0 12px', borderRadius: 24, overflow: 'hidden', background: 'radial-gradient(circle at 50% 38%, #F3FAFB 0%, #FBFCFD 65%)', border: '1px solid rgba(141,206,212,0.22)' }}>
        <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', backgroundImage: 'radial-gradient(rgba(141,206,212,0.22) 1px, transparent 1px)', backgroundSize: '14px 14px', opacity: 0.6 }} />
        <svg ref={svgRef} viewBox="0 0 360 520" width="100%" style={{ display: 'block', height: 'auto', position: 'relative' }} onClick={() => setSel(null)}>
          {PHYS_EDGES.map(([a, b, kind], i) => {
            const A = nodesById[a], B = nodesById[b];
            const inHL = !relatedIds || (relatedIds.has(a) && relatedIds.has(b));
            return <line key={i} data-eid={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke={inHL && relatedIds ? '#6B7280' : '#C5CBD3'} strokeWidth={kind === 'primary' ? 1.4 : 1.05} strokeDasharray={kind === 'dashed' ? '3 4' : null} strokeLinecap="round" opacity={relatedIds ? (inHL ? 0.9 : 0.12) : (kind === 'primary' ? 0.6 : kind === 'dashed' ? 0.45 : 0.5)} style={{ transition: 'opacity .3s, stroke .3s' }} />;
          })}
          {PHYS_NODES.map(n => {
            const isSel = sel === n.id, dim = relatedIds && !relatedIds.has(n.id);
            const lvl = n.isSubject ? null : masteryLevel(n.mastery);
            const labelLines = n.isSubject ? [n.name] : splitLabel(n.name);
            return (
              <g key={n.id} data-nid={n.id} style={{ cursor: 'pointer', opacity: dim ? 0.28 : 1, transition: 'opacity .3s', transform: `translate(${n.x}px, ${n.y}px)`, willChange: 'transform' }} onClick={e => { e.stopPropagation(); setSel(isSel ? null : n.id); }}>
                {isSel && <circle r={n.r + 10} fill={n.isSubject ? PHYS_COLOR : lvl.color} opacity="0.18" />}
                {n.isSubject ? <>
                  <circle r={n.r} fill={PHYS_COLOR} />
                  <circle r={n.r - 4} fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="1" />
                  <text textAnchor="middle" dy="6" fontSize="17" fontWeight="500" fill="#fff" style={{ fontFamily: 'inherit', letterSpacing: '.04em' }}>{n.name}</text>
                </> : <>
                  <circle r={n.r} fill="#fff" stroke={isSel ? lvl.color : 'rgba(141,206,212,0.6)'} strokeWidth={isSel ? 2.5 : 1.4} />
                  <MasteryArc r={n.r - 2} pct={n.mastery} color={lvl.color} />
                  <circle cx={n.r - 5} cy={-n.r + 5} r="4.5" fill={lvl.color} stroke="#fff" strokeWidth="1.5" />
                  {labelLines.map((line, li) => <text key={li} textAnchor="middle" dy={labelLines.length === 1 ? 4 : (li === 0 ? -2 : 11)} fontSize={labelLines.length === 1 ? 11 : 10} fontWeight="500" fill="#2A2D33" style={{ fontFamily: 'inherit' }}>{line}</text>)}
                </>}
              </g>);
          })}
        </svg>
      </div>
      <div style={{ padding: '12px 18px 0' }}>
        {sel && sel !== 'p0'
          ? <NodeDetail node={nodesById[sel]} onClose={() => setSel(null)} />
          : <div style={{ padding: '11px 14px', borderRadius: 16, background: '#FBFCFD', border: '1px dashed rgba(0,0,0,0.08)', display: 'flex', alignItems: 'center', gap: 10, color: '#7A7B83', fontSize: 12.5, lineHeight: 1.5 }}>
              <div style={{ width: 28, height: 28, borderRadius: 9, background: PHYS_COLOR, color: '#fff', flex: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{Icon.sparkle(14)}</div>
              <div>
                <div style={{ fontWeight: 600, color: '#3A3C45' }}>{sel === 'p0' ? '物理 · 高中知识图谱' : '物理 · 知识图谱'}</div>
                <div>实线 = 直接依赖 · 虚线 = 跨章联系 · 圆点颜色 = 掌握度</div>
              </div>
            </div>}
      </div>
    </div>);
}

function splitLabel(name) {
  if (name.includes('·')) return name.split('·').map(s => s.trim());
  if (name.length > 4) { const mid = Math.ceil(name.length / 2); return [name.slice(0, mid), name.slice(mid)]; }
  return [name];
}

function MasteryArc({ r, pct, color }) {
  const c = 2 * Math.PI * r, dash = c * (pct / 100);
  return <circle r={r} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeDasharray={`${dash} ${c}`} transform="rotate(-90)" opacity="0.55" />;
}

function NodeDetail({ node, onClose }) {
  const lvl = masteryLevel(node.mastery);
  return (
    <div style={{ background: '#fff', borderRadius: 18, padding: '14px 16px', border: '1px solid rgba(0,0,0,0.05)', animation: 'flashIn .35s cubic-bezier(.2,.7,.2,1)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <MasteryRing pct={node.mastery} color={lvl.color} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 15.5, fontWeight: 700, letterSpacing: '-0.005em' }}>{node.name}</div>
          <div style={{ marginTop: 4, fontSize: 11.5, color: '#8A8B93', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ padding: '1.5px 8px', borderRadius: 999, background: lvl.soft, color: lvl.color, fontWeight: 600 }}>{lvl.label}</span>
            <span>共 {node.total} 题</span><span style={{ opacity: .4 }}>·</span><span>错 {node.wrong} 题</span>
          </div>
        </div>
        <button onClick={onClose} style={{ width: 30, height: 30, borderRadius: '50%', background: '#F2F2F4', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#0A0A0A', flex: 'none' }}>{Icon.close(16)}</button>
      </div>
      <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px dashed rgba(0,0,0,0.06)' }}>
        <div style={{ fontSize: 11.5, color: '#8A8B93', fontWeight: 600, padding: '4px 0 4px' }}>近期相关题目</div>
        {node.recent.map((t, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 0', borderTop: i === 0 ? 'none' : '0.5px solid rgba(0,0,0,0.05)' }}>
            <div style={{ width: 5, height: 5, borderRadius: '50%', background: '#8DCED4', flex: 'none' }} />
            <div style={{ flex: 1, fontSize: 13, color: '#3A3C45' }}>{t}</div>
            <div style={{ color: '#C2C5CC' }}>{Icon.chevron(14)}</div>
          </div>))}
      </div>
    </div>);
}

function MasteryRing({ pct, color }) {
  const r = 18, c = 2 * Math.PI * r, dash = c * (pct / 100);
  return (
    <div style={{ width: 44, height: 44, position: 'relative', flex: 'none' }}>
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r={r} stroke="#F0F1F4" strokeWidth="4" fill="none" />
        <circle cx="22" cy="22" r={r} stroke={color} strokeWidth="4" fill="none" strokeLinecap="round" strokeDasharray={`${dash} ${c}`} transform="rotate(-90 22 22)" />
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#0F0F12' }}>{pct}</div>
    </div>);
}

    <>
      <SectionTitle title="学习历史" count={`共 ${history.length} 条`} action="全部 ›" />
      <div ref={listRef} className="hist-scroll" style={{ flex: 1, overflowY: 'auto', padding: '4px 18px 12px', display: 'flex', flexDirection: 'column', gap: 10, WebkitMaskImage: 'linear-gradient(180deg, #000 0, #000 calc(100% - 18px), transparent 100%)' }}>
        {history.map(item => <HistoryCard key={item.id} item={item} isNew={item.id === newId} onClick={onOpenResult} />)}
      </div>
      <ReadyPrompt />
    </>);
}

// ═══════════════════════════════════════════════════════════
// 详情页：批改结果 (三层渐进披露)
// ═══════════════════════════════════════════════════════════
const VERDICT_MAP = {
  correct: { label: '全部正确', desc: '完美！继续保持。', color: '#9ED1B0', soft: '#E8F4ED', emoji: '✓' },
  partial: { label: '部分正确', desc: '掌握得不错，再练几题。', color: '#EFB888', soft: '#FBEFE0', emoji: '◐' },
  wrong:   { label: '需要订正', desc: 'AI 给你准备好详细讲解。', color: '#E89A98', soft: '#FBEEEC', emoji: '✕' }
};

function DetailResult({ item, onClose }) {
  const [showCompare, setShowCompare] = useState(false);
  const [expandedQ, setExpandedQ] = useState(null);
  if (!item || !item.result) return null;
  const s = subjectMap[item.subjectId] || SUBJECTS[1];
  const r = item.result;
  const v = VERDICT_MAP[r.verdict] || VERDICT_MAP.partial;
  return (
    <div className="page-scroll" style={{ flex: 1, overflowY: 'auto', padding: '0 0 24px' }}>
      <div style={{ padding: '0 18px 16px' }}>
        <div style={{ borderRadius: 26, overflow: 'hidden', background: v.soft, padding: '20px 22px 22px', position: 'relative' }}>
          <div style={{ position: 'absolute', right: -20, top: -20, width: 130, height: 130, borderRadius: '50%', background: 'rgba(255,255,255,0.55)' }} />
          <div style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: '#5A5C65', fontWeight: 600 }}>
              <div style={{ width: 22, height: 22, borderRadius: 7, background: s.color, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700 }}>{s.short}</div>
              <span>{s.name}</span><span style={{ opacity: .4 }}>·</span><span>{item.time}</span>
            </div>
            <div style={{ marginTop: 14, fontSize: 32, fontWeight: 700, color: v.color, letterSpacing: '-0.01em', display: 'flex', alignItems: 'center', gap: 12 }}>
              <span style={{ width: 44, height: 44, borderRadius: 14, background: v.color, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26, fontWeight: 700 }}>{v.emoji}</span>
              {v.label}
            </div>
            <div style={{ marginTop: 8, fontSize: 14, color: '#3A3C45', lineHeight: 1.5 }}>{v.desc}</div>
            <div style={{ marginTop: 16, display: 'flex', alignItems: 'baseline', gap: 14, color: '#0F0F12' }}>
              <div>
                <span style={{ fontSize: 36, fontWeight: 700, color: v.color }}>{r.score}</span>
                <span style={{ fontSize: 18, color: '#8A8B93' }}> / {r.total}</span>
                <div style={{ fontSize: 11, color: '#8A8B93', marginTop: -2 }}>正确题数</div>
              </div>
              <div style={{ width: 1, height: 36, background: 'rgba(0,0,0,0.08)' }} />
              <div>
                <div style={{ fontSize: 11, color: '#8A8B93' }}>薄弱知识点</div>
                <div style={{ marginTop: 4, display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                  {r.weakPoints.map(w => <span key={w} style={{ fontSize: 11.5, fontWeight: 600, padding: '3px 9px', borderRadius: 999, background: '#fff', color: v.color }}>{w}</span>)}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div style={{ padding: '0 18px 12px' }}>
        <DisclosureCard open={showCompare} onToggle={() => setShowCompare(x => !x)} title="答案对比" subtitle={`你的答案 vs 正确答案 · 共 ${r.questions.length} 题`} accent={s.color}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, paddingTop: 6 }}>
            {r.questions.map((q, i) => (
              <div key={i} style={{ background: '#F8FAFC', borderRadius: 14, padding: '12px 14px', border: '1px solid rgba(0,0,0,0.04)' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                  <span style={{ width: 22, height: 22, borderRadius: 7, background: q.correct ? '#9ED1B0' : '#E89A98', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700 }}>{q.correct ? '✓' : '✕'}</span>
                  <span style={{ fontSize: 12.5, color: '#8A8B93', fontWeight: 600 }}>第 {i + 1} 题</span>
                </div>
                <div style={{ fontSize: 13.5, color: '#0F0F12', lineHeight: 1.5 }}>{q.q}</div>
                <div style={{ marginTop: 10, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                  <Cell label="你的答案" value={q.yourAnswer} bad={!q.correct} />
                  <Cell label="正确答案" value={q.correctAnswer} good />
                </div>
              </div>))}
          </div>
        </DisclosureCard>
      </div>
      <div style={{ padding: '0 18px' }}>
        <DisclosureCard open={expandedQ !== false} onToggle={() => setExpandedQ(expandedQ === false ? null : false)} title="AI 详细解析" subtitle="逐题讲解 · 点击题目展开思路" accent="#0A0A0A" defaultClosed>
          <div style={{ paddingTop: 6, display: 'flex', flexDirection: 'column', gap: 8 }}>
            {r.questions.map((q, i) => {
              const open = expandedQ === i;
              return (
                <div key={i} style={{ background: '#fff', borderRadius: 14, border: '1px solid rgba(0,0,0,0.06)', overflow: 'hidden' }}>
                  <div className="ex-row" onClick={() => setExpandedQ(open ? null : i)} style={{ padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 10 }}>
                    <span style={{ width: 22, height: 22, borderRadius: 7, background: q.correct ? '#9ED1B0' : '#E89A98', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flex: 'none' }}>{q.correct ? '✓' : '✕'}</span>
                    <div style={{ flex: 1, fontSize: 13.5, color: '#0F0F12', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>第 {i + 1} 题：{q.q.slice(0, 18)}…</div>
                    <div style={{ color: '#9CA0A8', transform: open ? 'rotate(180deg)' : '', transition: 'transform .2s' }}>{Icon.chevDown(16)}</div>
                  </div>
                  {open && <div style={{ padding: '4px 14px 14px', borderTop: '1px dashed rgba(0,0,0,0.06)' }}>
                    <div style={{ fontSize: 11.5, color: '#8A8B93', fontWeight: 600, padding: '8px 0 4px' }}>题目</div>
                    <div style={{ fontSize: 13, color: '#3A3C45', lineHeight: 1.6 }}>{q.q}</div>
                    <div style={{ fontSize: 11.5, color: '#8A8B93', fontWeight: 600, padding: '12px 0 4px' }}>解析</div>
                    <div style={{ fontSize: 13, lineHeight: 1.7, color: '#0F0F12', background: '#FBFCFD', borderRadius: 12, padding: '10px 12px', border: '1px solid rgba(0,0,0,0.04)' }}>{q.explanation}</div>
                  </div>}
                </div>);
            })}
          </div>
        </DisclosureCard>
      </div>
    </div>);
}

function Cell({ label, value, good, bad }) {
  const color = good ? '#1F8A5B' : bad ? '#B85450' : '#0F0F12';
  const bg = good ? '#EAF6EF' : bad ? '#FBEEEC' : '#fff';
  return (
    <div style={{ borderRadius: 11, padding: '8px 10px', background: bg }}>
      <div style={{ fontSize: 10.5, color: '#8A8B93', fontWeight: 600, letterSpacing: '0.04em' }}>{label}</div>
      <div style={{ marginTop: 3, fontSize: 13, fontWeight: 600, color, lineHeight: 1.4 }}>{value}</div>
    </div>);
}

function DisclosureCard({ open, onToggle, title, subtitle, accent, defaultClosed, children }) {
  return (
    <div style={{ background: '#fff', borderRadius: 22, border: '1px solid rgba(0,0,0,0.05)', overflow: 'hidden' }}>
      <div className="ex-row" onClick={onToggle} style={{ padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ width: 6, height: 30, borderRadius: 3, background: accent }} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: '#0F0F12' }}>{title}</div>
          <div style={{ fontSize: 11.5, color: '#8A8B93', marginTop: 2 }}>{subtitle}</div>
        </div>
        <div style={{ padding: '6px 10px', borderRadius: 999, background: open ? '#0A0A0A' : '#F2F2F4', color: open ? '#fff' : '#5A5C65', fontSize: 11.5, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4 }}>
          {open ? '收起' : '查看'}
          <div style={{ transform: open ? 'rotate(180deg)' : '', transition: 'transform .2s' }}>{Icon.chevDown(13)}</div>
        </div>
      </div>
      {open && <div style={{ padding: '0 16px 16px' }}>{children}</div>}
    </div>);
}

function DetailScreen({ item, onClose }) {
  return (
    <div className={'detail ' + (item ? 'open' : '')}>
      <div style={{ padding: '56px 14px 12px', display: 'flex', alignItems: 'center', gap: 10, background: '#FBFCFD' }}>
        <button onClick={onClose} style={{ width: 40, height: 40, borderRadius: '50%', background: '#F2F2F4', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#0A0A0A' }}>{Icon.back(20)}</button>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11.5, color: '#8A8B93', fontWeight: 600 }}>批改结果</div>
          <div style={{ fontSize: 16, fontWeight: 700, marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{item?.title || ''}</div>
        </div>
      </div>
      {item && <DetailResult item={item} onClose={onClose} />}
    </div>);
}

// ═══════════════════════════════════════════════════════════
// 弹层 / 上传 / Toast
// ═══════════════════════════════════════════════════════════
function SubjectPicker({ open, onClose, onPick }) {
  return (
    <>
      <div className={'sheet-backdrop ' + (open ? 'open' : '')} onClick={onClose} />
      <div className={'sheet ' + (open ? 'open' : '')}>
        <div style={{ display: 'flex', justifyContent: 'center', paddingTop: 8 }}><div style={{ width: 36, height: 5, borderRadius: 3, background: '#E2E3E8' }} /></div>
        <div style={{ padding: '14px 22px 4px', display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between' }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-0.01em' }}>选择科目</div>
            <div style={{ fontSize: 13, color: '#7A7B83', marginTop: 4 }}>拍照后 AI 将识别题型，给你讲解。</div>
          </div>
          <button onClick={onClose} style={{ width: 36, height: 36, borderRadius: '50%', background: '#F2F2F4', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{Icon.close(18)}</button>
        </div>
        <div style={{ padding: '14px 18px 28px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {SUBJECTS.map((s, i) => (
            <button key={s.id} onClick={() => onPick(s)} className="subj-tile" style={{ background: s.color, color: '#fff', border: 'none', cursor: 'pointer', borderRadius: 20, padding: '16px 16px 14px', textAlign: 'left', position: 'relative', overflow: 'hidden', minHeight: 100, boxShadow: `0 10px 20px -10px ${s.color}aa`, animationDelay: i * 40 + 'ms' }}>
              <div style={{ position: 'absolute', right: -8, bottom: -22, fontWeight: 900, fontSize: 96, color: 'rgba(255,255,255,0.32)', lineHeight: 1, pointerEvents: 'none' }}>{s.short}</div>
              <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: '-0.01em', marginTop: 6 }}>{s.name}</div>
              <div style={{ marginTop: 6, fontSize: 12, opacity: .9, lineHeight: 1.4 }}>{s.sub}</div>
            </button>))}
        </div>
      </div>
    </>);
}

function UploadingOverlay({ subject }) {
  if (!subject) return null;
  return (
    <div className="upload-overlay">
      <div className="upload-card">
        <div className="upload-shutter" style={{ background: subject.color }}>
          <div className="shutter-ring" style={{ borderColor: subject.color }} />
          <div style={{ fontSize: 30, color: '#fff', fontWeight: 700 }}>{subject.short}</div>
        </div>
        <div style={{ marginTop: 18, textAlign: 'center' }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{subject.name} · 拍照识别中</div>
          <div style={{ fontSize: 12.5, color: '#7A7B83', marginTop: 4 }}>AI 正在分析题目…</div>
        </div>
        <div className="upload-bar"><div className="upload-bar-fill" style={{ background: subject.color }} /></div>
      </div>
    </div>);
}

function Toast({ text, subject }) {
  if (!text) return null;
  return (
    <div className="toast">
      {subject && <div style={{ width: 26, height: 26, borderRadius: 8, background: subject.color, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 14 }}>{subject.short}</div>}
      <span>{text}</span>
    </div>);
}

// ═══════════════════════════════════════════════════════════
// 主应用
// ═══════════════════════════════════════════════════════════
function App() {
  const [tab,        setTab]        = useState('today');
  const [history,    setHistory]    = useState([]);      // API 加载
  const [tasks,      setTasks]      = useState([]);      // API 加载
  const [pickerOpen, setPickerOpen] = useState(false);
  const [uploading,  setUploading]  = useState(null);
  const [toast,      setToast]      = useState(null);
  const [newId,      setNewId]      = useState(null);
  const [detail,     setDetail]     = useState(null);
  const listRef      = useRef(null);
  const fileInputRef = useRef(null);   // 隐藏文件输入
  const pendingFileRef = useRef(null); // 待上传文件

  // ── 加载今日复习任务 ──────────────────────────────────────
  useEffect(() => {
    apiGet('/api/students/' + STUDENT_ID + '/review-tasks')
      .then(data => {
        const mapped = (data.tasks || []).map(t => ({
          id: t.knowledge_point_id,
          subjectId: SUBJECT_FROM_NAME[t.subject] || 'math',
          title: t.knowledge_point_name,
          count: t.recommended_count || 3,
          done: false,
          hint: t.reason || ('掌握度 ' + Math.round((t.mastery_score || 0) * 100) + '%'),
        }));
        setTasks(mapped.length ? mapped : INITIAL_TASKS);
      })
      .catch(() => setTasks(INITIAL_TASKS));
  }, []);

  // ── 加载历史记录 ──────────────────────────────────────────
  function refreshHistory() {
    return apiGet('/api/students/' + STUDENT_ID + '/assignments')
      .then(data => {
        const mapped = (data.items || []).map(item => ({
          id: item.assignment_id,
          subjectId: item.subject_id || null,
          title: item.title || '未命名作业',
          count: item.question_count || 1,
          time: item.time_display || '刚刚',
          status: item.status,
          result: null,
        }));
        setHistory(mapped);
        mapped.filter(it => it.status === 'grading').forEach(it => {
          startPoll(it.id, subjectMap[it.subjectId] || SUBJECTS[1]);
        });
        return mapped;
      })
      .catch(() => { setHistory(INITIAL_HISTORY); return []; });
  }
  useEffect(() => { refreshHistory(); }, []);

  // ── 轮询批改状态 ──────────────────────────────────────────
  function startPoll(assignmentId, s) {
    let tries = 0;
    async function check() {
      tries++;
      if (tries > 36) return;
      try {
        const asgn = await apiGet('/api/assignments/' + assignmentId);
        const st = (asgn.status || '').toLowerCase();
        if (st === 'ai_done') {
          try {
            const gdata = await apiGet('/api/grading/' + assignmentId);
            const result = mapGradingResult(gdata);
            const detected = SUBJECT_FROM_NAME[(gdata.grading || {}).subject];
            setHistory(h => h.map(it =>
              it.id === assignmentId ? { ...it, status: 'graded', result, subjectId: it.subjectId || detected || 'math' } : it));
            setToast({ text: (s ? s.name + ' · ' : '') + '已批改完成 · 点击查看', subject: s });
            setTimeout(() => setToast(null), 2800);
          } catch (_) {
            setHistory(h => h.map(it => it.id === assignmentId ? { ...it, status: 'graded' } : it));
          }
        } else if (st.includes('fail') || st === 'manual_required') {
          setHistory(h => h.map(it => it.id === assignmentId ? { ...it, status: 'failed' } : it));
        } else {
          setTimeout(check, 5000);
        }
      } catch (_) { if (tries < 36) setTimeout(check, 5000); }
    }
    setTimeout(check, 5000);
  }

  // ── 文件选择 → 打开科目选择器 ────────────────────────────
  function onFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    pendingFileRef.current = file;
    e.target.value = '';
    setPickerOpen(true);
  }

  // ── 选好科目 → 上传 + 批改 ───────────────────────────────
  async function pickSubject(s) {
    const file = pendingFileRef.current;
    pendingFileRef.current = null;
    setPickerOpen(false);
    if (!file) return;
    setTimeout(() => setUploading(s), 240);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const up = await apiUpload(fd);
      const aid = up.assignment_id;
      try { await apiPost('/api/grading/' + aid + '/start', {}); } catch (_) {}
      const newItem = {
        id: aid, subjectId: s.id,
        title: file.name.replace(/\.[^.]+$/, '') || (s.name + ' 作业'),
        count: 1, time: '刚刚', status: 'grading', result: null,
      };
      setHistory(h => [newItem, ...h]);
      setNewId(aid);
      setUploading(null);
      setTab('history');
      setToast({ text: s.name + ' · 已上传，AI 正在批改', subject: s });
      setTimeout(() => setToast(null), 2200);
      setTimeout(() => setNewId(null), 1400);
      if (listRef.current) listRef.current.scrollTop = 0;
      startPoll(aid, s);
    } catch (_) {
      setUploading(null);
      setToast({ text: '上传失败，请重试', subject: null });
      setTimeout(() => setToast(null), 2200);
    }
  }

  function askQuestion(text) {
    setToast({ text: `已发送：${text.length > 16 ? text.slice(0, 16) + '…' : text}`, subject: null });
    setTimeout(() => setToast(null), 1800);
  }

  function toggleTask(id) {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, done: !t.done } : t));
  }

  // ── 打开详情（懒加载） ────────────────────────────────────
  async function openResult(item) {
    if (item.status === 'grading') return;
    if (item.result) { setDetail(item); return; }
    try {
      const data = await apiGet('/api/grading/' + item.id);
      const result = mapGradingResult(data);
      const updated = { ...item, result };
      setHistory(h => h.map(it => it.id === item.id ? updated : it));
      setDetail(updated);
    } catch (_) { setDetail(item); }
  }

  return (
    <div style={{ width: '100%', height: '100%', background: 'linear-gradient(180deg,#FBFCFD 0%,#F5F8FB 100%)', display: 'flex', flexDirection: 'column', paddingTop: 56, position: 'relative', overflow: 'hidden' }}>
      <BrandHeader subtitle={
        tab === 'today'   ? '错题智能复习 · 每日一练' :
        tab === 'library' ? '物理 · 知识图谱' :
        '所有拍照批改记录'} />

      {tab === 'today'   && <TodayPage tasks={tasks} onToggle={toggleTask} />}
      {tab === 'library' && <PhysicsGraphPage />}
      {tab === 'history' && <HistoryPage history={history} newId={newId} listRef={listRef} onOpenResult={openResult} />}

      <BottomDock onCamera={() => fileInputRef.current && fileInputRef.current.click()} onAsk={askQuestion} />
      <TabBar value={tab} onChange={setTab} />

      {/* 隐藏文件输入（拍照/相册） */}
      <input ref={fileInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={onFileSelected} />

      <SubjectPicker open={pickerOpen} onClose={() => setPickerOpen(false)} onPick={pickSubject} />
      <UploadingOverlay subject={uploading} />
      <Toast text={toast?.text} subject={toast?.subject} />
      <DetailScreen item={detail} onClose={() => setDetail(null)} />
    </div>);
}

function Mounted() {
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, background: '#EEF2F7' }}>
      <IOSFrame width={402} height={874}><App /></IOSFrame>
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<Mounted />);
</script>
</body>
</html>
