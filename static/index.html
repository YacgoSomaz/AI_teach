// ─── API 层 ───────────────────────────────────────────────────
const STUDENT_ID = 'default_student';

const SUBJECT_NAMES = {
  phys: '物理', math: '数学', cn: '语文',
  en: '英语', chem: '化学', bio: '生物',
};

async function apiGet(path) {
  const r = await fetch(path, { headers: { 'X-Student-Id': STUDENT_ID } });
  if (!r.ok) throw new Error('GET ' + path + ' => ' + r.status);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Student-Id': STUDENT_ID },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('POST ' + path + ' => ' + r.status);
  return r.json();
}
async function apiUpload(formData) {
  const r = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'X-Student-Id': STUDENT_ID },
    body: formData,
  });
  if (!r.ok) throw new Error('upload => ' + r.status);
  return r.json();
}

// 将 /api/grading/{id} 响应映射到 ResultScreen 期望的 data 结构
// steps / reviewSuggestions / errorType / grade 等待 Kiro 补字段，当前 fallback 处理
function mapGradingToResult(data, title) {
  const g = data.grading || {};
  const analysis = data.analysis || {};
  const kps = Array.isArray(data.knowledge_points) ? data.knowledge_points : [];

  // is_correct===null means "no student answer detected" (not wrong)
  const hasAnswer = g.is_correct !== null && g.is_correct !== undefined;
  const isOk = g.is_correct === true;
  const ratio = parseFloat(g.score || 0) / Math.max(parseFloat(g.max_score || 1), 0.001);

  // correct_answer: DB field first, then raw AI response fallback from call1_raw
  const correctAnswer = g.correct_answer || analysis.raw_correct_answer || analysis.solution_answer || '—';

  // feedback / mistake_reason: same fallback chain
  const feedbackText = g.feedback || analysis.raw_feedback || g.mistake_reason || analysis.raw_mistake_reason || '';

  // steps: GradingResult.steps (Kiro field), else map solution_steps from call1_raw
  let steps = [];
  if (Array.isArray(g.steps) && g.steps.length > 0) {
    steps = g.steps;
  } else if (Array.isArray(analysis.solution_steps) && analysis.solution_steps.length > 0) {
    steps = analysis.solution_steps.map(s => ({ title: s.title || '步骤', detail: s.content || '' }));
  } else if (feedbackText) {
    steps = [{ title: 'AI 分析', detail: feedbackText }];
  }

  // verdict: compute AFTER we know whether AI produced analysis content
  // is_correct===null only means no student answer, NOT that AI failed to solve the problem
  const hasAnalysis = correctAnswer !== '—' || steps.length > 0;
  const verdict = hasAnswer
    ? (isOk ? 'correct' : ratio > 0 ? 'partial' : 'wrong')
    : (hasAnalysis ? 'analysis_only' : 'empty');

  // review suggestions
  const kpNames = kps.map(k => k.name || k.knowledge_point_name || '').filter(Boolean);
  let reviewSuggestions = [];
  if (Array.isArray(g.review_suggestions) && g.review_suggestions.length > 0) {
    reviewSuggestions = g.review_suggestions;
  } else {
    reviewSuggestions = kpNames.slice(0, 3).map(k => '复习知识点：' + k);
    if (reviewSuggestions.length === 0) reviewSuggestions = ['建议多做相关练习题。'];
  }

  // summary line shown in result card header
  const oneLine = feedbackText
    || (verdict === 'analysis_only' ? '未检测到作答，以下是 AI 解析。'
      : isOk ? '回答正确！' : '请参考 AI 解析。');

  // question struct (from analysis.question_struct which comes from call1_raw)
  const qs = analysis.question_struct || {};

  return {
    title: title || '批改结果',
    chapter: analysis.detected_subject || '物理',
    grade: analysis.detected_grade || g.grade || '八年级',
    type: qs.question_type || '作业批改',
    prompt: qs.stem || '（题目内容）',
    studentAnswer: g.student_answer || (verdict === 'analysis_only' ? '（未检测到作答）' : hasAnswer ? '（未识别）' : '（未作答）'),
    correctAnswer,
    verdict,
    oneLine,
    steps,
    knowledgePoints: kpNames.length ? kpNames : ['待分析'],
    weakPoint: kpNames[0] || '—',
    errorType: g.error_type || '—',
    reviewSuggestions,
  };
}

  // 计算高亮的节点集合（选中 + 与之相连）
  const relatedIds = useMemo(() => {
    if (!sel) return null;
    const ids = new Set([sel]);
    PHYS_EDGES.forEach(([a, b]) => {
      if (a === sel) ids.add(b);
      if (b === sel) ids.add(a);
    });
    return ids;
  }, [sel]);

  // rAF 漂浮：直接 DOM 改 transform / line 端点，不触发 React 重渲染
  useEffect(() => {
    let raf;
    const start = performance.now();
    function tick(now) {
      const t = (now - start) / 1000;
      const svg = svgRef.current;
      if (!svg) return;
      const offsets = {};
      PHYS_NODES.forEach((n, i) => {
        const dx = Math.sin(t * 0.45 + i * 0.7) * 1.0;
        const dy = Math.cos(t * 0.38 + i * 1.1) * 1.0;
        offsets[n.id] = [dx, dy];
        const g = svg.querySelector(`[data-nid="${n.id}"]`);
        // 用 CSS transform（GPU 合成）代替 SVG transform 属性，不重新光栅化 text
        if (g) g.style.transform = `translate(${(n.x + dx).toFixed(2)}px, ${(n.y + dy).toFixed(2)}px)`;
      });
      PHYS_EDGES.forEach(([a, b], i) => {
        const ln = svg.querySelector(`[data-eid="${i}"]`);
        if (!ln) return;
        const A = nodesById[a], B = nodesById[b];
        const [adx, ady] = offsets[a];
        const [bdx, bdy] = offsets[b];
        ln.setAttribute('x1', A.x + adx);
        ln.setAttribute('y1', A.y + ady);
        ln.setAttribute('x2', B.x + bdx);
        ln.setAttribute('y2', B.y + bdy);
      });
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [nodesById]);

  const PHYS_COLOR = '#8DCED4';
  const totalKp = PHYS_NODES.length - 1;

  return (
    <div className="page-scroll" style={{ flex: 1, overflowY: 'auto', padding: '0 0 8px' }}>
      {/* 顶部 chip 行 */}
      <div style={{ padding: '0 22px 10px', display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{
          padding: '4px 11px', borderRadius: 999, fontSize: 12, fontWeight: 700,
          background: PHYS_COLOR, color: '#fff',
        }}>物理</div>
        <div style={{ fontSize: 12.5, color: '#8A8B93' }}>
          {totalKp} 个知识点 · {PHYS_EDGES.length} 条关联
        </div>
        <div style={{ marginLeft: 'auto', fontSize: 11.5, color: '#9CA0A8' }}>
          点击节点查看详情
        </div>
      </div>

      {/* SVG 图谱画布 */}
      <div style={{
        position: 'relative', margin: '0 12px',
        borderRadius: 24, overflow: 'hidden',
        background: 'radial-gradient(circle at 50% 38%, #F3FAFB 0%, #FBFCFD 65%)',
        border: '1px solid rgba(141,206,212,0.22)',
      }}>
        {/* 网点背景 */}
        <div style={{
          position: 'absolute', inset: 0, pointerEvents: 'none',
          backgroundImage: 'radial-gradient(rgba(141,206,212,0.22) 1px, transparent 1px)',
          backgroundSize: '14px 14px',
          opacity: 0.6,
        }} />

        <svg ref={svgRef}
          viewBox="0 0 360 520"
          width="100%"
          style={{ display: 'block', height: 'auto', position: 'relative' }}
          onClick={() => setSel(null)}>

          {/* Edges */}
          {PHYS_EDGES.map(([a, b, kind], i) => {
            const A = nodesById[a], B = nodesById[b];
            const inHL = !relatedIds || (relatedIds.has(a) && relatedIds.has(b));
            return (
              <line key={i} data-eid={i}
                x1={A.x} y1={A.y} x2={B.x} y2={B.y}
                stroke={inHL && relatedIds ? '#6B7280' : '#C5CBD3'}
                strokeWidth={kind === 'primary' ? 1.4 : 1.05}
                strokeDasharray={kind === 'dashed' ? '3 4' : null}
                strokeLinecap="round"
                opacity={relatedIds ? (inHL ? 0.9 : 0.12) : (kind === 'primary' ? 0.6 : kind === 'dashed' ? 0.45 : 0.5)}
                style={{ transition: 'opacity .3s, stroke .3s' }}
              />
            );
          })}

          {/* Nodes */}
          {PHYS_NODES.map(n => {
            const isSel = sel === n.id;
            const dim = relatedIds && !relatedIds.has(n.id);
            const lvl = n.isSubject ? null : masteryLevel(n.mastery);
            const labelLines = n.isSubject ? [n.name] : splitLabel(n.name);

            return (
              <g key={n.id} data-nid={n.id}
                style={{
                  cursor: 'pointer',
                  opacity: dim ? 0.28 : 1,
                  transition: 'opacity .3s',
                  transform: `translate(${n.x}px, ${n.y}px)`,
                  willChange: 'transform',
                }}
                onClick={(e) => { e.stopPropagation(); setSel(isSel ? null : n.id); }}>
                {/* halo */}
                {isSel && <circle r={n.r + 10} fill={n.isSubject ? PHYS_COLOR : lvl.color} opacity="0.18" />}

                {n.isSubject ? (
                  <>
                    <circle r={n.r} fill={PHYS_COLOR} />
                    <circle r={n.r - 4} fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="1" />
                    <text textAnchor="middle" dy="6" fontSize="17" fontWeight="500" fill="#fff"
                      style={{ fontFamily: 'inherit', letterSpacing: '.04em' }}>{n.name}</text>
                  </>
                ) : (
                  <>
                    {/* outer ring */}
                    <circle r={n.r} fill="#fff"
                      stroke={isSel ? lvl.color : 'rgba(141,206,212,0.6)'}
                      strokeWidth={isSel ? 2.5 : 1.4} />
                    {/* mastery arc */}
                    <MasteryArc r={n.r - 2} pct={n.mastery} color={lvl.color} />
                    {/* mastery dot top-right */}
                    <circle cx={n.r - 5} cy={-n.r + 5} r="4.5" fill={lvl.color}
                      stroke="#fff" strokeWidth="1.5" />
                    {/* label inside */}
                    {labelLines.map((line, li) => (
                      <text key={li} textAnchor="middle"
                        dy={labelLines.length === 1 ? 4 : (li === 0 ? -2 : 11)}
                        fontSize={labelLines.length === 1 ? 11 : 10}
                        fontWeight="500" fill="#2A2D33"
                        style={{ fontFamily: 'inherit' }}>{line}</text>
                    ))}
                  </>
                )}
              </g>
            );
          })}
        </svg>
      </div>

      {/* 底部说明 / 节点详情 */}
      <div style={{ padding: '12px 18px 0' }}>
        {sel && sel !== 'p0' ? (
          <NodeDetail node={nodesById[sel]} onClose={() => setSel(null)} />
        ) : (
          <div style={{
            padding: '11px 14px', borderRadius: 16,
            background: '#FBFCFD', border: '1px dashed rgba(0,0,0,0.08)',
            display: 'flex', alignItems: 'center', gap: 10,
            color: '#7A7B83', fontSize: 12.5, lineHeight: 1.5,
          }}>
            <div style={{
              width: 28, height: 28, borderRadius: 9,
              background: PHYS_COLOR, color: '#fff', flex: 'none',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            }}>{Ic.spark(14)}</div>
            <div>
              <div style={{ fontWeight: 600, color: '#3A3C45' }}>
                {sel === 'p0' ? '物理 · 八年级知识图谱' : '物理 · 知识图谱'}
              </div>
              <div>实线 = 直接依赖 · 虚线 = 跨章联系 · 圆点颜色 = 掌握度</div>
            </div>
          </div>
        )}
      </div>
    </div>);

}

// 把知识点名拆成最多两行（便于塞进小圆里）
function splitLabel(name) {
  // 优先按 · 切；否则按字数 4 切
  if (name.includes('·')) {
    const parts = name.split('·').map(s => s.trim());
    return parts;
  }
  if (name.length > 4) {
    const mid = Math.ceil(name.length / 2);
    return [name.slice(0, mid), name.slice(mid)];
  }
  return [name];
}

// SVG 圆环 mastery 弧（已 transform 到节点中心）
function MasteryArc({ r, pct, color }) {
  const c = 2 * Math.PI * r;
  const dash = c * (pct / 100);
  return (
    <circle r={r} fill="none" stroke={color} strokeWidth="2"
      strokeLinecap="round"
      strokeDasharray={`${dash} ${c}`}
      transform="rotate(-90)"
      opacity="0.55" />
  );
}

const PIPELINE = [
{ id: 'enhance', title: '图片优化', detail: '压缩 · 增强对比度 · 保留题干细节', dur: 1500 },
{ id: 'recognize', title: '识别题目', detail: 'OCR 提取文字 · 解析题型结构', dur: 1900 },

// ═══════════════════════════════════════════════════════════════
// 内联批改进度卡（嵌入聊天流里）
// ═══════════════════════════════════════════════════════════════
function InlinePipelineCard({ msg, onViewResult }) {
  const [timerStep, setTimerStep] = useState(0);
  const [streamCount, setStreamCount] = useState(0);
  const [animDone, setAnimDone] = useState(false);
  // 3 分钟后切换后台模式：显示轻量提示，让用户可以离开页面
  const [bgMode, setBgMode] = useState(false);

  // 取后端实时进度（msg.currentStep）与计时器动画的最大值，
  // 确保 UI 不落后于真实进度。
  const step = Math.max(timerStep, msg.currentStep || 0);

  useEffect(() => {
    const timers = [];
    let acc = 0;
    PIPELINE.forEach((s, i) => {
      acc += s.dur;
      timers.push(setTimeout(() => setTimerStep(i + 1), acc));
    });
    timers.push(setTimeout(() => setAnimDone(true), acc));

    const solveStart = PIPELINE.slice(0, 2).reduce((a, s) => a + s.dur, 0);
    const solveLen = PIPELINE[2].dur;
    const perLine = solveLen / (STREAM_LINES.length + 1);
    STREAM_LINES.forEach((_, idx) => {
      timers.push(setTimeout(() => setStreamCount(c => c + 1), solveStart + perLine * (idx + 0.5)));
    });
    // 3 分钟后进入后台模式
    timers.push(setTimeout(() => setBgMode(true), 3 * 60 * 1000));
    return () => timers.forEach(clearTimeout);
  }, []);

  // 后端完成时立即显示按钮，不等待计时器动画结束
  const canView = msg.resultReady;

  // ── 后台模式：轻量卡片，用户可离开 ──────────────────────────
  if (bgMode && !canView && !msg.failed) {
    return (
      <div style={{ maxWidth: '88%' }}>
        <div className="card" style={{ padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10 }}>
          {/* 旋转圈 */}
          <div style={{
            width: 20, height: 20, borderRadius: '50%', flex: 'none',
            border: '2.5px solid #E2E4E9', borderTopColor: '#15161B',
            animation: 'spin 1s linear infinite'
          }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: '#15161B' }}>AI 还在解题中</div>
            <div style={{ fontSize: 11.5, color: '#8A8B93', marginTop: 1 }}>完成后会在历史记录里出现，你可以先去做其他题</div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: '88%' }}>
      <div className="card" style={{ padding: '12px 14px' }}>
        {/* pipeline steps */}
        {PIPELINE.map((s, i) => {
          const state = i < step ? 'done' : i === step ? 'current' : 'pending';
          const isLast = i === PIPELINE.length - 1;
          return (
            <div key={s.id} style={{ display: 'flex', gap: 10 }}>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 3, flex: 'none' }}>
                <div className={'step-dot ' + state} style={{ width: 22, height: 22, fontSize: 10.5 }}>
                  {state === 'done'
                    ? <span className="check-pop">{Ic.check(11)}</span>
                    : <span style={{ opacity: state === 'pending' ? 0.6 : 1 }}>{i + 1}</span>}
                </div>
                {!isLast && <div className={'step-line ' + state} style={{ minHeight: 10 }} />}
              </div>
              <div style={{ flex: 1, paddingTop: 3, paddingBottom: isLast ? 0 : 10 }}>
                <div style={{
                  fontSize: 13, fontWeight: state === 'pending' ? 500 : 700,
                  color: state === 'pending' ? '#B5B8BF' : '#15161B'
                }}>{s.title}</div>
                {state !== 'pending' && s.streaming && (
                  <StreamingContent lines={STREAM_LINES.slice(0, streamCount)} showing={state === 'current'} />
                )}
                {state !== 'pending' && s.detail && (
                  <div style={{ marginTop: 3, fontSize: 12, color: '#6E727B', lineHeight: 1.5 }}>{s.detail}</div>
                )}
              </div>
            </div>
          );
        })}

        {/* failed state */}
        {msg.failed && (
          <div style={{ marginTop: 10, padding: '8px 10px', borderRadius: 10, background: '#FCE9E9', color: '#C04A4A', fontSize: 12.5 }}>
            {msg.failMsg || '批改未通过，请重试'}
          </div>
        )}

        {/* waiting for result after animation */}
        {animDone && !msg.resultReady && !msg.failed && (
          <div style={{ marginTop: 10, fontSize: 12, color: '#8A8B93', textAlign: 'center', padding: '4px 0' }}>
            AI 老师还在思考，稍候…
          </div>
        )}

        {/* CTA when both animation done and result ready */}
        {canView && (
          <button onClick={() => onViewResult && onViewResult(msg.resultData)} style={{
            marginTop: 10, width: '100%', padding: '10px 0', borderRadius: 12,
            background: '#15161B', color: '#fff', border: 'none', cursor: 'pointer',
            fontSize: 14, fontWeight: 600
          }}>查看批改结果 →</button>
        )}
      </div>
    </div>
  );
}

function RichStepText({ text }) {
  const blocks = splitRichText(text || '');
  if (blocks.length === 0) return null;

  return (
    <div style={{ marginTop: 7, display: 'flex', flexDirection: 'column', gap: 9 }}>
      {blocks.map((block, i) => block.type === 'formula' ? (
        <div key={i} style={{
          margin: '3px 0 5px',
          padding: '9px 11px',
          borderRadius: 10,
          background: '#F7F8FA',
          border: '1px solid #ECEFF3',
          color: '#15161B',
          fontSize: 13,
          lineHeight: 1.65,
          overflowX: 'auto',
          whiteSpace: 'pre-wrap',
          wordBreak: 'break-word',
          fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
        }}><FormulaText text={block.text} /></div>
      ) : (
        <p key={i} style={{
          margin: 0,
          color: '#5A5C65',
          fontSize: 12.8,
          lineHeight: 1.9,
          textIndent: '2em',
          textAlign: 'justify'
        }}>{block.text}</p>
      ))}
    </div>
  );
}

function splitRichText(text) {
  const normalized = String(text)
    .replace(/\r\n/g, '\n')
    .replace(/；\s*/g, '；\n')
    .replace(/。\s*/g, '。\n')
    .replace(/([，、])\s*(?=代入|变形|根据|即可|可行|不可行)/g, '$1\n');
  const lines = normalized.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const blocks = [];
  lines.forEach((line) => {
    const parts = line.split(/(\$[^$]+\$|\\frac\{[^}]+\}\{[^}]+\}|[A-Za-z][A-Za-z0-9_]*\s*=\s*[^，。；]+)/g)
      .map(s => s.trim())
      .filter(Boolean);
    parts.forEach((part) => {
      const looksFormula = isStandaloneFormula(part);
      if (looksFormula) {
        blocks.push({ type: 'formula', text: part });
      } else {
        pushTextBlock(blocks, part);
      }
    });
  });
  return blocks;
}

function pushTextBlock(blocks, text) {
  const clean = normalizeInlineMath(text).trim();
  if (!clean) return;
  const last = blocks[blocks.length - 1];
  if (last && last.type === 'text') {
    const needsSpace = /[A-Za-z0-9]$/.test(last.text) && /^[A-Za-z0-9]/.test(clean);
    last.text += `${needsSpace ? ' ' : ''}${clean}`;
  } else {
    blocks.push({ type: 'text', text: clean });
  }
}

function isStandaloneFormula(part) {
  const clean = String(part).trim().replace(/^\$|\$$/g, '');
  if (/^\\?[A-Za-z]$/.test(clean)) return false;
  if (/^[A-Za-z]$/.test(clean)) return false;
  return /\\frac|[A-Za-z][A-Za-z0-9_]*\s*=|[=<>]|\\cdot|\\times/.test(clean);
}

function FormulaText({ text }) {
  const tokens = parseFormulaTokens(normalizeFormula(text));
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, flexWrap: 'wrap' }}>
      {tokens.map((token, i) => token.type === 'frac' ? (
        <span key={i} style={{
          display: 'inline-flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          verticalAlign: 'middle',
          margin: '0 2px',
          lineHeight: 1.05,
          fontSize: 12.5
        }}>
          <span style={{ padding: '0 4px 2px' }}>{token.num}</span>
          <span style={{ width: '100%', minWidth: 18, borderTop: '1.5px solid currentColor' }} />
          <span style={{ padding: '2px 4px 0' }}>{token.den}</span>
        </span>
      ) : (
        <span key={i}>{token.text}</span>
      ))}
    </span>
  );
}

function parseFormulaTokens(text) {
  const tokens = [];
  const re = /\\frac\{([^}]+)\}\{([^}]+)\}/g;
  let last = 0;
  let match;
  while ((match = re.exec(text)) !== null) {
    if (match.index > last) tokens.push({ type: 'text', text: text.slice(last, match.index) });
    tokens.push({ type: 'frac', num: normalizeInlineMath(match[1]), den: normalizeInlineMath(match[2]) });
    last = match.index + match[0].length;
  }
  if (last < text.length) tokens.push({ type: 'text', text: text.slice(last) });
  return tokens;
}

function normalizeFormula(text) {
  return String(text)
    .replace(/^\$|\$$/g, '')
    .replace(/\\cdot/g, '·')
    .replace(/\\times/g, '×')
    .replace(/\\\(/g, '')
    .replace(/\\\)/g, '');
}

function normalizeInlineMath(text) {
  return String(text)
    .replace(/\\cdot/g, '·')
    .replace(/\\times/g, '×')
    .replace(/^\$|\$$/g, '');
}

function AnswerCell({ label, value, good, bad }) {
  const accent = good ? '#1F8A5B' : bad ? '#C04A4A' : '#15161B';
  const bg = good ? '#F0F8F4' : bad ? '#FDF1F1' : '#F8FAFC';
  return (
    <div style={{
      padding: '10px 14px',
      borderRadius: 12, background: bg,
      borderLeft: '3px solid ' + accent
    }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: "rgb(0, 0, 0)", fontFamily: "Arial" }}>{label}</div>
      <div style={{ marginTop: 3, fontSize: 14.5, color: accent, fontWeight: 600, lineHeight: 1.45 }}>{value}</div>
    </div>);

}

function SubLabel({ children }) {
  return (
    <div style={{ fontSize: 11.5, color: '#8A8B93', fontWeight: 700, letterSpacing: '.02em' }}>{children}</div>);

}

function Mini({ label, value, accent }) {
  return (
    <div style={{
      padding: '10px 12px',
      borderRadius: 12, background: '#fff', border: '1px solid #ECEFF3'
    }}>

}

function Disclosure({ open, onToggle, title, subtitle, iconBg, icon, children }) {
  return (
    <div className="card" style={{ overflow: 'hidden' }}>
      <div onClick={onToggle} className="row-press" style={{
        padding: '14px 16px',
        display: 'flex', alignItems: 'center', gap: 12
      }}>
        <div style={{
          width: 32, height: 32, borderRadius: 10, flex: 'none',
          background: iconBg, color: '#fff',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>{icon}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14.5, fontWeight: 700 }}>{title}</div>
          <div style={{ fontSize: 11.5, color: '#8A8B93', marginTop: 2 }}>{subtitle}</div>
        </div>
        <div style={{
          padding: '5px 10px', borderRadius: 999,
          background: open ? '#15161B' : '#F2F3F6',
          color: open ? '#fff' : '#5A5C65',
          fontSize: 11.5, fontWeight: 600,
          display: 'flex', alignItems: 'center', gap: 4
        }}>
          {open ? '收起' : '查看'}
          <div style={{ transform: open ? 'rotate(180deg)' : '', transition: 'transform .2s' }}>{Ic.chevD(12)}</div>
        </div>
      </div>
      {open &&
      <div className="fade-up" style={{
        padding: '4px 16px 18px',
        borderTop: '1px dashed #ECEFF3'
      }}>
          <div style={{ paddingTop: 14 }}>{children}</div>
        </div>
      }
    </div>);

}

function Toast({ text }) {
  if (!text) return null;
  return <div className="toast">{text}</div>;
}

// ═══════════════════════════════════════════════════════════════
// 主应用
// ═══════════════════════════════════════════════════════════════
function App() {
  const [tab,           setTab]           = useState('home');
  const [tasks,         setTasks]         = useState([]);
  const [history,       setHistory]       = useState([]);
  const [grading,       setGrading]       = useState(null);          // null | 'streaming' | 'result'
  const [gradingResult, setGradingResult] = useState(null);          // 真实批改结果
  const [chapter,       setChapter]       = useState(null);
  const [toast,         setToast]         = useState(null);
  const [chatMessages,  setChatMessages]  = useState([]);
  const [currentAid,   setCurrentAid]    = useState(null);          // 当前 assignment_id（聊天用）
  const fileInputRef   = useRef(null);

  // ── 加载复习任务 ──────────────────────────────────────────
  useEffect(() => {
    apiGet('/api/students/' + STUDENT_ID + '/review-tasks')
      .then(data => {
        const mapped = (data.tasks || []).map(t => ({
          id:      t.knowledge_point_id,
          chapter: t.subject || '物理',
          point:   t.knowledge_point_name,
          count:   t.recommended_count || 3,
          done:    false,
          hint:    t.reason || ('掌握度 ' + Math.round((t.mastery_score || 0) * 100) + '%'),
        }));
        if (mapped.length) setTasks(mapped);
      })
      .catch(() => {});  // 保持 TODAY_TASKS 兜底
  }, []);

  // ── 加载 / 刷新历史记录 ───────────────────────────────────
  function refreshHistory() {
    return apiGet('/api/students/' + STUDENT_ID + '/assignments')
      .then(data => {
        const mapped = (data.items || []).map(item => ({
          id:      item.assignment_id,
          chapter: SUBJECT_NAMES[item.subject_id] || '物理',
          title:   item.title || '未命名作业',
          verdict: item.verdict || (item.status === 'ai_done' || item.status === 'graded' ? 'analysis_only' : 'empty'),
          time:    item.time_display || '刚刚',
          status:  item.status,
        }));
        if (mapped.length) setHistory(mapped);
      })
      .catch(() => {});
  }
  useEffect(() => { refreshHistory(); }, []);

  // ── 轮询批改状态 ──────────────────────────────────────────
  // 注：使用 /api/grading/{id}，该接口同时返回 status + 批改数据，
  // 避免调用不存在的 /api/assignments/{id}。
  function startPoll(aid, title, progressId) {
    // 后端 status → 流程步骤序号（共 5 步，0-based）
    const STATUS_STEP = {
      uploaded: 0, ocr_queued: 0,
      ocr_running: 1,
      ocr_done: 2,
      ai_running: 3,
    };
    let tries = 0;
    const startMs = Date.now();
    async function check() {
      tries++;
      // 前 3 分钟：5 秒/次；3 分钟后降为 15 秒/次（用户已收到"可离开"提示）
      const elapsed = Date.now() - startMs;
      const interval = elapsed < 3 * 60 * 1000 ? 5000 : 15000;
      // 超过 20 分钟才真正超时（豆包最坏情况：3 次重试 × ~5 分钟 = 15 分钟）
      if (elapsed > 20 * 60 * 1000) {
        setChatMessages(m => m.map(msg => msg._id === progressId
          ? { ...msg, failed: true, failMsg: '批改超时，请在历史记录重新上传' } : msg));
        return;
      }
      try {
        const data = await apiGet('/api/grading/' + aid);
        const st = (data.status || '').toLowerCase();

        // 推进流程步骤（实时映射真实后端进度）
        const currentStep = STATUS_STEP[st] ?? 0;
        setChatMessages(m => m.map(msg => msg._id === progressId
          ? { ...msg, currentStep } : msg));

        if (st === 'ai_done') {
          const result = mapGradingToResult(data, title);
          setChatMessages(m => m.map(msg => msg._id === progressId
            ? { ...msg, currentStep: 5, resultReady: true, resultData: result } : msg));
          refreshHistory();
        } else if (st === 'manual_required') {
          const reason = data.analysis?.support_status || '';
          const failMsg = reason === 'unsupported_subject' ? '题目学科暂不支持 AI 批改'
            : reason === 'unsupported_grade' ? '年级暂不支持 AI 批改'
            : '题目暂不支持 AI 批改';
          setChatMessages(m => m.map(msg => msg._id === progressId
            ? { ...msg, failed: true, failMsg } : msg));
        } else if (st === 'ai_failed' || st === 'failed') {
          setChatMessages(m => m.map(msg => msg._id === progressId
            ? { ...msg, failed: true, failMsg: '批改出错，请重试' } : msg));
        } else {
          setTimeout(check, interval);
        }
      } catch (_) { if (elapsed < 20 * 60 * 1000) setTimeout(check, interval); }
    }
    setTimeout(check, 2000);                          // 上传后 2 秒开始轮询
  }

  // ── 拍照按钮 → 触发隐藏文件输入 ──────────────────────────
  function onCameraClick() {
    fileInputRef.current && fileInputRef.current.click();
  }

  // ── 文件选定 → 上传 → 开始批改 ───────────────────────────
  function onFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setGradingResult(null);
    const title = file.name.replace(/\.[^.]+$/, '') || '作业';
    const previewUrl = URL.createObjectURL(file);
    const progressId = Date.now();
    const fd = new FormData();
    fd.append('file', file);
    apiUpload(fd)
      .then(up =>
        apiPost('/api/grading/' + up.assignment_id + '/start', {})
          .then(() => up.assignment_id)
          .catch(() => up.assignment_id)
      )
      .then(aid => {
        setCurrentAid(aid);
        // 同时插入：题目图片消息 + 内联批改进度卡
        setChatMessages(m => [...m,
          { type: 'photo', caption: title, previewUrl },
          { type: 'grading', _id: progressId, title }
        ]);
        startPoll(aid, title, progressId);
      })
      .catch(() => {
        URL.revokeObjectURL(previewUrl);
        showToast('上传失败，请重试');
      });
  }

  // ── 关闭批改结果详情 ──────────────────────────────────────────
  function closeResult() {
    setGrading(null);
    setGradingResult(null);
  }

  // ── 从内联卡片打开批改结果页 ──────────────────────────────────
  function onViewResult(resultData) {
    setGradingResult(resultData);
    setGrading('result');
  }

  // ── 历史记录点击 → 懒加载真实结果 ───────────────────────
  async function openHistoryItem(item) {
    if (item.status === 'grading') return;
    try {
      const data = await apiGet('/api/grading/' + item.id);
      const result = mapGradingToResult(data, item.title);
      setCurrentAid(item.id);
      setGradingResult(result);
      setGrading('result');
    } catch (_) {
      showToast('加载失败，请重试');
    }
  }

  function toggleTask(id) {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, done: !t.done } : t));
  }

  function reportWrong() {
    showToast('反馈已收到');
  }

  function sendChatMessage(text) {
    setChatMessages(m => [...m, { role: 'user', text }]);
    const aid = currentAid || 'general';
    // 先插一条空的 AI 消息，后续流式追加
    const aiIdx = Date.now();
    setChatMessages(m => [...m, { role: 'ai', text: '', _id: aiIdx }]);
    fetch('/api/chat/' + aid, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Student-Id': STUDENT_ID },
      body: JSON.stringify({ message: text }),
    }).then(resp => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      function read() {
        reader.read().then(({ done, value }) => {
          if (done) return;
          const chunk = decoder.decode(value, { stream: true });
          chunk.split('\n').forEach(line => {
            if (!line.startsWith('data:')) return;
            const raw = line.slice(5).trim();
            if (raw === '[DONE]') return;
            try {
              const obj = JSON.parse(raw);
              if (obj.err) {
                setChatMessages(m => m.map(msg =>
                  msg._id === aiIdx ? { ...msg, text: obj.err } : msg));
              } else if (obj.t) {
                setChatMessages(m => m.map(msg =>
                  msg._id === aiIdx ? { ...msg, text: msg.text + obj.t } : msg));
              }
            } catch (_) {}
          });
          read();
        });
      }
      read();
    }).catch(() => {
      setChatMessages(m => m.map(msg =>
        msg._id === aiIdx ? { ...msg, text: 'AI 老师暂时不可用，请稍后再试～' } : msg));
    });
  }

  function showToast(text) {
    setToast({ text });
    setTimeout(() => setToast(null), 2400);
  }

  const resultData = gradingResult;

  return (
    <div style={{
      width: '100%', height: '100%',
      background: '#F8FAFC',
      display: 'flex', flexDirection: 'column',
      paddingTop: 56, position: 'relative', overflow: 'hidden'
    }}>
      {/* BrandHeader 只在拍题页隐藏 */}
      {tab !== 'home' && <BrandHeader />}

      {tab === 'home' && <HomePage
        onCamera={onCameraClick}
        messages={chatMessages}
        onSend={sendChatMessage}
        onViewResult={onViewResult} />}
      {tab === 'review'  && <ReviewPage tasks={tasks} onToggle={toggleTask} />}
      {tab === 'library' && <PhysicsGraphPage />}
      {tab === 'history' && <HistoryPage items={history} onOpen={openHistoryItem} />}

      <TabBar value={tab} onChange={setTab} />

      {/* 隐藏文件输入（拍照 / 相册）*/}
      <input ref={fileInputRef} type="file" accept="image/*"
        style={{ display: 'none' }} onChange={onFileSelected} />

      {/* overlays */}
      {grading === 'result' && <ResultScreen data={resultData} onClose={closeResult} onWrong={reportWrong} />}

      <Toast text={toast?.text} />
    </div>);
}

function Mounted() {
  return (
    <div style={{
      minHeight: '100svh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 'clamp(0px, 2.5vw, 24px)', background: '#EEF2F7',
      overflow: 'hidden'
    }}>
      <IOSFrame><App /></IOSFrame>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<Mounted />);


</script>
</body>
</html>
