    content: '';

  /* ─── 流式批改：步骤指示器 ────────────────────────── */
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none; transition: background .3s, color .3s;
    font-size: 12.5px; font-weight: 600;
  }
  .step-dot.pending { background: #F2F3F6; color: #B5B8BF; }
  .step-dot.current { background: #15161B; color: #fff; }
  .step-dot.done    { background: #1F8A5B; color: #fff; }

  .step-line {
    width: 2px; flex: 1; min-height: 14px;
    background: linear-gradient(180deg, currentColor 50%, transparent 50%);
    background-size: 2px 5px;
    background-repeat: repeat-y;
    margin: 4px 0;
  }
  .step-line.done { background: #1F8A5B; }
  .step-line.pending { color: #E2E4E9; }
  .step-line.current { color: #C9CCD2; }

  /* pulsing ring around current step */
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(21,22,27,0.35); }
    70%  { box-shadow: 0 0 0 9px rgba(21,22,27,0); }
    100% { box-shadow: 0 0 0 0 rgba(21,22,27,0); }
  }
  .step-dot.current { animation: pulseRing 1.6s infinite; }

  /* streaming line fade-in */
  @keyframes streamIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stream-line {
    animation: streamIn .35s cubic-bezier(.2,.7,.2,1) backwards;
  }

  /* caret blink */
  @keyframes caretBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .caret {
    display: inline-block; width: 7px; height: 15px;
    background: #15161B; margin-left: 2px; vertical-align: -2px;
    animation: caretBlink 1s steps(1) infinite;
    border-radius: 1px;
  }

  /* slide-up overlay */
  .overlay {
    position: absolute; inset: 0;
    background: #FAFBFD;
    z-index: 100; overflow: hidden;
    display: flex; flex-direction: column;
    transform: translateY(102%);
    transition: transform .38s cubic-bezier(.22,.8,.28,1);
  }

  /* result fade in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }

    from { transform: translate(-50%, 12px); opacity: 0; }

const STUDENT_ID = 'default_student';

const SUBJECT_NAMES = {
  phys: '物理', math: '数学', cn: '语文',
  en: '英语', chem: '化学', bio: '生物',
};

async function apiGet(path) {
  const r = await fetch(path, { headers: { 'X-Student-Id': STUDENT_ID } });
  if (!r.ok) throw new Error('GET ' + path + ' => ' + r.status);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Student-Id': STUDENT_ID },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('POST ' + path + ' => ' + r.status);
  return r.json();
}
async function apiUpload(formData) {
  const r = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'X-Student-Id': STUDENT_ID },
    body: formData,
  });
  if (!r.ok) throw new Error('upload => ' + r.status);
  return r.json();
}

// 将 /api/grading/{id} 响应映射到 ResultScreen 期望的 data 结构
// steps / reviewSuggestions / errorType / grade 等待 Kiro 补字段，当前 fallback 处理
function mapGradingToResult(data, title) {
  const g = data.grading || {};
  const analysis = data.analysis || {};
  const kps = Array.isArray(data.knowledge_points) ? data.knowledge_points : [];
  const isOk = g.is_correct === true;
  const ratio = parseFloat(g.score || 0) / Math.max(parseFloat(g.max_score || 1), 0.001);
  const verdict = isOk ? 'correct' : ratio > 0 ? 'partial' : 'wrong';
  const kpNames = kps.map(k => k.name || k.knowledge_point_name || '').filter(Boolean);
  const qs = analysis.question_struct || {};
  const firstQ = Array.isArray(qs.questions) && qs.questions[0];
  return {
    title: title || '批改结果',
    chapter: analysis.detected_subject || '物理',
    grade: g.grade || '八年级',                          // TODO: Kiro 补字段
    type: (firstQ && firstQ.type) || '作业批改',
    prompt: (firstQ && firstQ.content) || '（题目内容）',
    studentAnswer: g.student_answer || '（未识别）',
    correctAnswer: g.correct_answer || '—',
    verdict,
    oneLine: g.feedback || g.mistake_reason || (isOk ? '回答正确！' : '请参考详细解析。'),
    steps: Array.isArray(g.steps) ? g.steps              // TODO: Kiro 补字段
      : (g.feedback ? [{ title: 'AI 分析', detail: g.feedback }] : []),
    knowledgePoints: kpNames.length ? kpNames : ['待分析'],
    weakPoint: kpNames[0] || '—',
    errorType: g.error_type || '—',                      // TODO: Kiro 补字段
    reviewSuggestions: Array.isArray(g.review_suggestions) ? g.review_suggestions  // TODO: Kiro 补字段
      : kpNames.slice(0, 3).map(k => '复习知识点：' + k).concat(
          kpNames.length === 0 ? ['建议多做相关练习题。'] : []
        ),
  };
}

function ChatInputBar({ onCamera, onSend, placeholder = '拍题或追问这道题…' }) {
  const ACCENT = '#0F8B82';
  const [text, setText] = useState('');
  const hasText = !!text.trim();

  const send = () => {
    if (!hasText) return;
    onSend && onSend(text.trim());
    setText('');
  };
  const handleCamera = () => {
    onCamera && onCamera();
  };

  return (
    <div style={{
      padding: '10px 14px 12px',
      background: '#F8FAFC',
      flex: 'none',
      position: 'relative',
      boxShadow: '0 -8px 18px -10px rgba(21,22,27,0.08)'
    }}>
      <div style={{
        background: '#fff',
        borderRadius: 28,
        padding: '7px 7px 7px 7px',
        display: 'flex', alignItems: 'center', gap: 6,
        border: '1px solid #E5E8EE',
        boxShadow: '0 4px 14px -8px rgba(21,22,27,0.1)',
        position: 'relative', zIndex: 2
      }}>
        {/* 相机按钮 · 主拍题入口 */}
        <button onClick={handleCamera} title="拍照" style={{
          width: 42, height: 42, borderRadius: '50%',
          background: '#15161B',
          color: '#fff',
          border: 'none', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flex: 'none', fontFamily: 'inherit',
          boxShadow: `0 4px 12px -4px ${ACCENT}66, inset 0 0 0 1px ${ACCENT}33`,
          position: 'relative'
        }}>
          {Ic.camera(20)}
        </button>

        {/* 输入框 */}
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && send()}
          placeholder={placeholder}
          style={{
            flex: 1, minWidth: 0, height: 36,
            border: 'none', outline: 'none', background: 'transparent',
            fontSize: 15, color: '#15161B', padding: '0 4px',
            fontFamily: 'inherit'
          }} />

        {/* 发送 */}
        <button onClick={send} style={{
          width: 38, height: 38, borderRadius: '50%',
          background: hasText ? ACCENT : '#F2F4F7',
          color: hasText ? '#fff' : '#B5B8BF',
          border: 'none',
          cursor: hasText ? 'pointer' : 'default',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flex: 'none', fontFamily: 'inherit',
          transition: 'background .18s, color .18s, box-shadow .18s',
          boxShadow: hasText ? `0 4px 12px -4px ${ACCENT}80` : 'none'
        }}>{Ic.arrow(15)}</button>
      </div>
    </div>);

}

function ReviewPage({ tasks, onToggle }) {
  const done = tasks.filter((t) => t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const allDone = done === total;

  return (
    <div className="scroll" style={{ flex: 1, overflowY: 'auto', padding: '0 0 14px' }}>
      <div style={{ padding: '0 22px 14px' }}>
        <div className="card" style={{
          padding: '16px 18px',
          background: allDone ? '#E6F4ED' : '#15161B',
          color: allDone ? '#1F4A33' : '#fff',
          border: 'none'
        }}>
          <div style={{ fontSize: 11.5, opacity: 0.7, fontWeight: 600 }}>
            
          </div>
          <div style={{ marginTop: 6, fontSize: 22, fontWeight: 700, letterSpacing: '-0.01em' }}>
            {allDone ? '今日复习全部完成 ✓' : `今天还有 ${total - done} 个任务`}
          </div>
          <div style={{ marginTop: 4, fontSize: 12.5, opacity: 0.75 }}>
            {allDone ? '坚持是最了不起的事，明天继续。' : `预计 ${(total - done) * 4} 分钟  ${pct}% 已完成`}
          </div>
          <div style={{
            marginTop: 14, height: 5, borderRadius: 3,
            background: allDone ? 'rgba(31,74,51,0.2)' : 'rgba(255,255,255,0.14)',
            overflow: 'hidden'
          }}>
            <div style={{
              width: pct + '%', height: '100%', borderRadius: 3,
              background: allDone ? '#1F8A5B' : '#fff',
              transition: 'width .5s cubic-bezier(.2,.7,.2,1)'
            }} />
          </div>
        </div>
      </div>

      <SectionLabel title="复习任务" action={`${done} / ${total}`} />
      <div style={{ padding: '0 22px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        {tasks.length === 0
          ? <div style={{ textAlign: 'center', padding: '40px 0', color: '#8A8B93', fontSize: 13 }}>
              暂无复习任务<br />
              <span style={{ fontSize: 12, opacity: 0.7 }}>拍题批改后自动生成</span>
            </div>
          : tasks.map((t) => <TaskRow key={t.id} task={t} onToggle={onToggle} />)
        }
      </div>

      <div style={{
        margin: '14px 22px 0', padding: '11px 14px', borderRadius: 14,
        background: '#FBFCFD', border: '1px dashed rgba(0,0,0,0.08)',
        display: 'flex', alignItems: 'center', gap: 10,
        color: '#6E727B', fontSize: 12, lineHeight: 1.5
      }}>
        <div style={{
          width: 28, height: 28, borderRadius: 9,
          background: '#15161B', color: '#fff', flex: 'none',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>{Ic.spark(14)}</div>
        <div>AI 根据你的错题生成，完成后会更新章节掌握度</div>
      </div>
    </div>);

}

  { c: '#1F8A5B', bg: '#E6F4ED', label: '已掌握' };

  return (
    <div onClick={onClick} className="card ch-card" style={{ padding: '14px 16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{
          width: 36, height: 36, borderRadius: 12,

        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 15.5, fontWeight: 700, letterSpacing: '-0.005em' }}>{ch.name}</div>
          <div style={{ marginTop: 4, display: 'flex', alignItems: 'center', gap: 8, fontSize: 11.5, color: '#8A8B93' }}>
            <Pill color={band.c} bg={band.bg}>{band.label} {ch.mastery}%</Pill>
            <span>{ch.last}</span>
          </div>
        </div>
        <div style={{ color: '#B5B8BF' }}>{Ic.chev(16)}</div>
      </div>
      {/* mastery bar */}
      <div style={{
        marginTop: 10, height: 4, borderRadius: 2,

      }}>
        <div style={{
          width: ch.mastery + '%', height: '100%', borderRadius: 2,

}

            return (

                </div>

                <div style={{ color: '#B5B8BF' }}>{Ic.chev(14)}</div>

        </div>

    </div>);

}

// 圆环掌握度
function Ring({ pct, color, size = 56, small = false }) {
  const r = (size - 6) / 2;
  const c = 2 * Math.PI * r;
  const dash = c * (pct / 100);
  return (
    <div style={{ width: size, height: size, position: 'relative', flex: 'none' }}>
      <svg width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#F2F3F6" strokeWidth={small ? 3 : 4} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={small ? 3 : 4} fill="none"
        strokeLinecap="round" strokeDasharray={`${dash} ${c}`}
        transform={`rotate(-90 ${size / 2} ${size / 2})`} />
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: small ? 10 : 14, fontWeight: 700, color: '#15161B'
      }}>{pct}</div>
    </div>);

}

// AI 流式批改页面（核心）
// ═══════════════════════════════════════════════════════════════
const PIPELINE = [
{ id: 'enhance', title: '图片优化', detail: '压缩 · 增强对比度 · 保留题干细节', dur: 1500 },
{ id: 'recognize', title: '识别题目', detail: 'OCR 提取文字 · 解析题型结构', dur: 1900 },
{ id: 'solve', title: 'AI 老师正在分析', streaming: true, dur: 7800 },
{ id: 'compare', title: '比对学生作答', detail: '识别作答内容 · 逐步判断正误', dur: 1900 },
{ id: 'match', title: '匹配知识点', detail: '关联课标知识点 · 更新掌握度', dur: 1500 }];


function GradingScreen({ onDone, onClose, title, previewUrl }) {
  const [step, setStep] = useState(0); // 0..PIPELINE.length-1
  const [streamCount, setStreamCount] = useState(0);
  const [finished, setFinished] = useState(false);

  useEffect(() => {
    const timers = [];
    let acc = 0;
    PIPELINE.forEach((s, i) => {
      acc += s.dur;
      timers.push(setTimeout(() => setStep(i + 1), acc));
    });
    // After last step → finished state with auto-advance button visible
    timers.push(setTimeout(() => setFinished(true), acc));
    // Auto-advance to result after a brief pause
    timers.push(setTimeout(() => onDone(), acc + 1100));

    // streaming for solve step
    const solveStart = PIPELINE.slice(0, 2).reduce((a, s) => a + s.dur, 0);
    const solveLen = PIPELINE[2].dur;
    const perLine = solveLen / (STREAM_LINES.length + 1);
    STREAM_LINES.forEach((_, idx) => {
      timers.push(setTimeout(() => setStreamCount((c) => c + 1), solveStart + perLine * (idx + 0.5)));
    });

    return () => timers.forEach(clearTimeout);
  }, []);

  return (
    <div className="overlay open" style={{ background: '#FAFBFD' }}>
      {/* header */}
      <div style={{
        padding: '56px 14px 8px',
        display: 'flex', alignItems: 'center', gap: 10
      }}>
        <button onClick={onClose} style={{
          width: 40, height: 40, borderRadius: '50%',
          background: '#fff', border: '1px solid #ECEFF3', cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#15161B'
        }}>{Ic.close(18)}</button>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11.5, color: '#8A8B93', fontWeight: 600 }}>正在批改</div>
          <div style={{ fontSize: 16, fontWeight: 700, marginTop: 1 }}>AI 老师 · 一题一答</div>
        </div>
        <div style={{ color: '#B5B8BF' }}>{Ic.more(18)}</div>
      </div>

      {/* 题目卡 */}
      <div style={{ padding: '6px 16px 6px' }}>
        <div className="card" style={{
          padding: '12px 14px',
          display: 'grid', gridTemplateColumns: '64px 1fr', gap: 12, alignItems: 'center'
        }}>
          {previewUrl
            ? <img src={previewUrl} alt="题目" style={{ width: 64, height: 64, borderRadius: 10, objectFit: 'cover', flex: 'none' }} />
            : <QuestionThumb size={64} />
          }
          <div style={{ minWidth: 0 }}>
            <div style={{ display: 'flex', gap: 6, marginBottom: 4 }}>
              <Pill bg="#F2F3F6" color="#15161B">AI 批改中</Pill>
            </div>
            <div style={{ fontSize: 13, color: '#15161B', lineHeight: 1.45,
              display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical',
              overflow: 'hidden'
            }}>{title || '正在识别题目内容…'}</div>
          </div>
        </div>
      </div>

      {/* timeline */}
      <div className="scroll" style={{ flex: 1, overflowY: 'auto', padding: '6px 18px 18px' }}>
        {PIPELINE.map((s, i) => {
          const state = i < step ? 'done' : i === step ? 'current' : 'pending';
          const isLast = i === PIPELINE.length - 1;
          return (
            <div key={s.id} style={{ display: 'flex', gap: 14 }}>
              {/* left: dot + line */}
              <div style={{
                display: 'flex', flexDirection: 'column', alignItems: 'center',
                paddingTop: 4, flex: 'none'
              }}>
                <div className={'step-dot ' + state}>
                  {state === 'done' ? <span className="check-pop">{Ic.check(14)}</span> :
                  state === 'current' ? <span>{i + 1}</span> :
                  <span style={{ opacity: 0.6 }}>{i + 1}</span>}
                </div>
                {!isLast && <div className={'step-line ' + state} />}
              </div>

              {/* right: content */}
              <div style={{ flex: 1, paddingTop: 5, paddingBottom: isLast ? 0 : 14 }}>
                <div style={{
                  fontSize: 14.5,
                  fontWeight: state === 'pending' ? 500 : 700,
                  color: state === 'pending' ? '#B5B8BF' : '#15161B',
                  letterSpacing: '-0.005em'
                }}>{s.title}</div>

                {state !== 'pending' &&
                <>
                    {s.detail &&
                  <div style={{ marginTop: 4, fontSize: 12.5, color: '#6E727B', lineHeight: 1.5 }}>
                        {s.detail}
                      </div>
                  }
                    {s.streaming &&
                  <StreamingContent
                    lines={STREAM_LINES.slice(0, streamCount)}
                    showing={state === 'current'} />

                  }
                  </>
                }
              </div>
            </div>);

        })}

        {/* finish state */}
        {finished &&
        <div className="fade-up" style={{ padding: '10px 4px 0' }}>
            <div style={{
            padding: '12px 14px', borderRadius: 14,
            background: '#E6F4ED', color: '#1F4A33',
            display: 'flex', alignItems: 'center', gap: 10
          }}>
              <div style={{
              width: 32, height: 32, borderRadius: '50%',
              background: '#1F8A5B', color: '#fff',
              display: 'flex', alignItems: 'center', justifyContent: 'center'
            }}>{Ic.check(16)}</div>
              <div>
                <div style={{ fontSize: 13.5, fontWeight: 700 }}>批改完成</div>
                <div style={{ fontSize: 11.5, opacity: 0.8 }}>正在为你整理结果…</div>
              </div>
            </div>
          </div>
        }
      </div>
    </div>);

}

function StreamingContent({ lines, showing }) {
  return (
    <div style={{ marginTop: 8 }}>
      {lines.map((l, i) =>
      <div key={i} className="stream-line" style={{
        padding: '6px 0',
        fontSize: 13.5, color: '#15161B', lineHeight: 1.6,
        borderTop: i === 0 ? 'none' : '1px dashed #ECEFF3'
      }}>
          {l}
          {showing && i === lines.length - 1 && <span className="caret" />}
        </div>
      )}
      {showing && lines.length === 0 &&
      <div style={{ padding: '8px 0', color: '#8A8B93', fontSize: 12.5, display: 'flex', alignItems: 'center', gap: 6 }}>
          <span style={{
          width: 8, height: 8, borderRadius: '50%', background: '#15161B', display: 'inline-block',
          animation: 'pulseRing 1.4s infinite'
        }} />
          正在读图…
        </div>
      }
    </div>);

}

// ═══════════════════════════════════════════════════════════════
// 主应用
// ═══════════════════════════════════════════════════════════════
function App() {
  const [tab,           setTab]           = useState('home');
  const [tasks,         setTasks]         = useState([]);
  const [history,       setHistory]       = useState([]);
  const [grading,       setGrading]       = useState(null);          // null | 'streaming' | 'result'
  const [gradingResult, setGradingResult] = useState(null);          // 真实批改结果
  const [chapter,       setChapter]       = useState(null);
  const [toast,         setToast]         = useState(null);
  const [chatMessages,  setChatMessages]  = useState([]);
  const [pendingTitle,  setPendingTitle]  = useState('');            // 上传中的题目名
  const [pendingPreview,setPendingPreview]= useState(null);          // 上传中的图片预览
  const [currentAid,   setCurrentAid]    = useState(null);          // 当前 assignment_id（聊天用）
  const fileInputRef   = useRef(null);
  const gradingDataRef = useRef(null);   // 轮询完成后暂存，等动画结束再展示
  const animDoneRef    = useRef(false);  // GradingScreen 动画是否已结束

  // ── 加载复习任务 ──────────────────────────────────────────
  useEffect(() => {
    apiGet('/api/students/' + STUDENT_ID + '/review-tasks')
      .then(data => {
        const mapped = (data.tasks || []).map(t => ({
          id:      t.knowledge_point_id,
          chapter: t.subject || '物理',
          point:   t.knowledge_point_name,
          count:   t.recommended_count || 3,
          done:    false,
          hint:    t.reason || ('掌握度 ' + Math.round((t.mastery_score || 0) * 100) + '%'),
        }));
        if (mapped.length) setTasks(mapped);
      })
      .catch(() => {});  // 保持 TODAY_TASKS 兜底
  }, []);

  // ── 加载 / 刷新历史记录 ───────────────────────────────────
  function refreshHistory() {
    return apiGet('/api/students/' + STUDENT_ID + '/assignments')
      .then(data => {
        const mapped = (data.items || []).map(item => ({
          id:      item.assignment_id,
          chapter: SUBJECT_NAMES[item.subject_id] || '物理',
          title:   item.title || '未命名作业',
          verdict: item.verdict || 'empty',
          time:    item.time_display || '刚刚',
          status:  item.status,
        }));
        if (mapped.length) setHistory(mapped);
      })
      .catch(() => {});
  }
  useEffect(() => { refreshHistory(); }, []);

  // ── 轮询批改状态 ──────────────────────────────────────────
  function startPoll(aid, title) {
    let tries = 0;
    async function check() {
      tries++;
      if (tries > 36) return;
      try {
        const asgn = await apiGet('/api/assignments/' + aid);
        const st = (asgn.status || '').toLowerCase();
        if (st === 'ai_done') {
          const gdata = await apiGet('/api/grading/' + aid);
          const result = mapGradingToResult(gdata, title);
          gradingDataRef.current = result;
          refreshHistory();
          // 若动画已结束则立即跳到结果页，否则等 gradingDone() 触发
          if (animDoneRef.current) {
            setGradingResult(result);
            setGrading('result');
          }
        } else if (st === 'manual_required') {
          const reason = asgn.processing_status?.grading?.reason || '';
          const msg = reason === 'image_too_small' ? '图片太小，请拍清晰一点再试'
            : reason === 'image_dimension_too_small' ? '图片分辨率太低，请靠近拍摄'
            : reason === 'unsupported_file_type' ? '不支持该图片格式'
            : '题目暂不支持 AI 批改';
          showToast(msg);
          setGrading(null);
        } else if (st.includes('fail')) {
          showToast('批改出错，请重试');
          setGrading(null);
        } else {
          setTimeout(check, 5000);
        }
      } catch (_) { if (tries < 36) setTimeout(check, 5000); }
    }
    setTimeout(check, 3000);
  }

  // ── 拍照按钮 → 触发隐藏文件输入 ──────────────────────────
  function onCameraClick() {
    fileInputRef.current && fileInputRef.current.click();
  }

  // ── 文件选定 → 上传 → 开始批改 ───────────────────────────
  function onFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    gradingDataRef.current = null;
    animDoneRef.current = false;
    setGradingResult(null);
    setGrading('streaming');
    const title = file.name.replace(/\.[^.]+$/, '') || '作业';
    // 生成本地预览 URL，立即在聊天里显示真实图片
    const previewUrl = URL.createObjectURL(file);
    setPendingTitle(title);
    setPendingPreview(previewUrl);
    const fd = new FormData();
    fd.append('file', file);
    apiUpload(fd)
      .then(up =>
        apiPost('/api/grading/' + up.assignment_id + '/start', {})
          .then(() => up.assignment_id)
          .catch(() => up.assignment_id)
      )
      .then(aid => {
        setCurrentAid(aid);
        startPoll(aid, title);
        setChatMessages(m => [...m, { type: 'photo', caption: title, previewUrl }]);
      })
      .catch(() => {
        URL.revokeObjectURL(previewUrl);
        setPendingPreview(null);
        setGrading(null);
        showToast('上传失败，请重试');
      });
  }

  // ── GradingScreen 动画结束回调 ────────────────────────────
  // 若结果已就绪 → 立即展示；若未就绪 → 保持 GradingScreen finished 态等轮询
  function gradingDone() {
    animDoneRef.current = true;
    if (gradingDataRef.current) {
      setGradingResult(gradingDataRef.current);
      setGrading('result');
    }
  }

  // ── 关闭批改结果 ──────────────────────────────────────────
  function closeResult() {
    const r = gradingResult;
    setGrading(null);
    setGradingResult(null);
    gradingDataRef.current = null;
    animDoneRef.current = false;
    if (r) {
      setChatMessages(m => [...m,
        { role: 'ai', text: r.oneLine + '\n\n已加入复习计划、错题库与历史。' }
      ]);
      showToast('批改完成，已更新知识库掌握度');
    }
  }

  function abortGrading() {
    setGrading(null);
    gradingDataRef.current = null;
    animDoneRef.current = false;
  }

  // ── 历史记录点击 → 懒加载真实结果 ───────────────────────
  async function openHistoryItem(item) {
    if (item.status === 'grading') return;
    try {
      const data = await apiGet('/api/grading/' + item.id);
      const result = mapGradingToResult(data, item.title);
      setCurrentAid(item.id);
      setGradingResult(result);
      setGrading('result');
    } catch (_) {
      showToast('加载失败，请重试');
    }
  }

  function toggleTask(id) {
    setTasks(ts => ts.map(t => t.id === id ? { ...t, done: !t.done } : t));
  }

  function reportWrong() {
    showToast('反馈已收到');
  }

  function sendChatMessage(text) {
    setChatMessages(m => [...m, { role: 'user', text }]);
    const aid = currentAid || 'general';
    // 先插一条空的 AI 消息，后续流式追加
    const aiIdx = Date.now();
    setChatMessages(m => [...m, { role: 'ai', text: '', _id: aiIdx }]);
    fetch('/api/chat/' + aid, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Student-Id': STUDENT_ID },
      body: JSON.stringify({ message: text }),
    }).then(resp => {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      function read() {
        reader.read().then(({ done, value }) => {
          if (done) return;
          const chunk = decoder.decode(value, { stream: true });
          chunk.split('\n').forEach(line => {
            if (!line.startsWith('data:')) return;
            const raw = line.slice(5).trim();
            if (raw === '[DONE]') return;
            try {
              const obj = JSON.parse(raw);
              if (obj.err) {
                setChatMessages(m => m.map(msg =>
                  msg._id === aiIdx ? { ...msg, text: obj.err } : msg));
              } else if (obj.t) {
                setChatMessages(m => m.map(msg =>
                  msg._id === aiIdx ? { ...msg, text: msg.text + obj.t } : msg));
              }
            } catch (_) {}
          });
          read();
        });
      }
      read();
    }).catch(() => {
      setChatMessages(m => m.map(msg =>
        msg._id === aiIdx ? { ...msg, text: 'AI 老师暂时不可用，请稍后再试～' } : msg));
    });
  }

  function showToast(text) {
    setToast({ text });
    setTimeout(() => setToast(null), 2400);
  }

  const resultData = gradingResult;

  return (
    <div style={{
      width: '100%', height: '100%',
      background: '#F8FAFC',
      display: 'flex', flexDirection: 'column',
      paddingTop: 56, position: 'relative', overflow: 'hidden'
    }}>
      {/* BrandHeader 只在拍题页隐藏 */}
      {tab !== 'home' && <BrandHeader />}

      {tab === 'home' && <HomePage
        onCamera={onCameraClick}
        messages={chatMessages}
        onSend={sendChatMessage} />}
      {tab === 'review'  && <ReviewPage tasks={tasks} onToggle={toggleTask} />}
      {tab === 'library' && <LibraryPage onOpenChapter={setChapter} />}
      {tab === 'history' && <HistoryPage items={history} onOpen={openHistoryItem} />}

      <TabBar value={tab} onChange={setTab} />

      {/* 隐藏文件输入（拍照 / 相册）*/}
      <input ref={fileInputRef} type="file" accept="image/*"
        style={{ display: 'none' }} onChange={onFileSelected} />

      {/* overlays */}
      {grading === 'streaming' && <GradingScreen onDone={gradingDone} onClose={abortGrading} title={pendingTitle} previewUrl={pendingPreview} />}
      {grading === 'result'    && <ResultScreen data={resultData} onClose={closeResult} onWrong={reportWrong} />}
      {chapter && <ChapterDetail chapter={chapter} onClose={() => setChapter(null)} />}

      <Toast text={toast?.text} />
    </div>);
}

function Mounted() {
  return (
    <div style={{
      minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 24, background: '#EEF2F7'
    }}>
      <IOSFrame width={402} height={874}><App /></IOSFrame>
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<Mounted />);


</script>
</body>
</html>
