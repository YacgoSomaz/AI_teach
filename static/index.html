// 未登录立即跳登录页，避免白屏；登录成功后保留原前端体验。
(function(){
  var token = localStorage.getItem('auth_token');
  if (!token) { window.location.replace('/login'); return; }
  try {
    var b = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    b += '='.repeat((4 - b.length % 4) % 4);
    var p = JSON.parse(atob(b));
    if (p.exp && Date.now() / 1000 > p.exp) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_email');
      window.location.replace('/login');
    }
  } catch(e) {
    localStorage.removeItem('auth_token');
    window.location.replace('/login');
  }
})();

// ─── JWT 邮箱解码 ─────────────────────────────────────────────
function getUserEmail() {
  try {
    const token = localStorage.getItem('auth_token');
    if (!token) return '';
    const b = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const p = JSON.parse(atob(b + '='.repeat((4 - b.length % 4) % 4)));
    return p.email || p.sub || '';
  } catch(e) {
    return localStorage.getItem('user_email') || '';
  }
}

// ─── API 层 ───────────────────────────────────────────────────
const STUDENT_ID = 'default_student';

const SUBJECT_NAMES = {
  phys: '物理', math: '数学', cn: '语文',
  en: '英语', chem: '化学', bio: '生物',
};

async function apiGet(path) {
  const r = await fetch(path, { headers: { 'X-Student-Id': STUDENT_ID } });
  if (!r.ok) throw new Error('GET ' + path + ' => ' + r.status);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Student-Id': STUDENT_ID },
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('POST ' + path + ' => ' + r.status);
  return r.json();
}
async function apiUpload(formData) {
  const r = await fetch('/api/upload', {
    method: 'POST',
    headers: { 'X-Student-Id': STUDENT_ID },
    body: formData,
  });
  if (!r.ok) throw new Error('upload => ' + r.status);
  return r.json();
}

function mapGradingToResult(data, title) {
  const g = data.grading || {};
  const analysis = data.analysis || {};
  const kps = Array.isArray(data.knowledge_points) ? data.knowledge_points : [];
  const hasAnswer = g.is_correct !== null && g.is_correct !== undefined;
  const isOk = g.is_correct === true;
  const ratio = parseFloat(g.score || 0) / Math.max(parseFloat(g.max_score || 1), 0.001);
  const correctAnswer = g.correct_answer || analysis.raw_correct_answer || analysis.solution_answer || '—';
  const feedbackText = g.feedback || analysis.raw_feedback || g.mistake_reason || analysis.raw_mistake_reason || '';
  let steps = [];
  if (Array.isArray(g.steps) && g.steps.length > 0) {
    steps = g.steps;
  } else if (Array.isArray(analysis.solution_steps) && analysis.solution_steps.length > 0) {
    steps = analysis.solution_steps.map(s => ({ title: s.title || '步骤', detail: s.content || '' }));
  } else if (feedbackText) {
    steps = [{ title: 'AI 分析', detail: feedbackText }];
  }
  const hasAnalysis = correctAnswer !== '—' || steps.length > 0;
  const verdict = hasAnswer
    ? (isOk ? 'correct' : ratio > 0 ? 'partial' : 'wrong')
    : (hasAnalysis ? 'analysis_only' : 'empty');
  const kpNames = kps.map(k => k.name || k.knowledge_point_name || '').filter(Boolean);
  let reviewSuggestions = [];
  if (Array.isArray(g.review_suggestions) && g.review_suggestions.length > 0) {
    reviewSuggestions = g.review_suggestions;
  } else {
    reviewSuggestions = kpNames.slice(0, 3).map(k => '复习知识点：' + k);
    if (reviewSuggestions.length === 0) reviewSuggestions = ['建议多做相关练习题。'];
  }
  const oneLine = feedbackText
    || (verdict === 'analysis_only' ? '未检测到作答，以下是 AI 解析。'
      : isOk ? '回答正确！' : '请参考 AI 解析。');
  const qs = analysis.question_struct || {};
  const kr = data.knowledge_review || {};
  const krPoints = Array.isArray(kr.knowledge_points) ? kr.knowledge_points.filter(Boolean) : [];
  const krWeak = Array.isArray(kr.weak_points) ? kr.weak_points.filter(Boolean) : [];
  const krActions = Array.isArray(kr.recommended_actions) ? kr.recommended_actions.filter(Boolean) : [];
  const krDetails = (Array.isArray(kr.knowledge_point_details) ? kr.knowledge_point_details : [])
    .map(d => ({ name: ((d && d.name) || '').trim(), source: (d && d.source) || 'taxonomy' }))
    .filter(d => d.name);
  const knowledgeReview = {
    knowledge_points: krPoints.length ? krPoints : kpNames,
    knowledge_point_details: krDetails,
    weak_points: krWeak,
    mistake_type_label: (kr.mistake_type_label || '').trim(),
    mistake_reason: (kr.mistake_reason || '').trim(),
    recommended_actions: krActions.slice(0, 3),
  };
  return {
    title: title || '批改结果',
    chapter: analysis.detected_subject || '物理',
    grade: analysis.detected_grade || g.grade || '八年级',
    type: qs.question_type || '作业批改',
    prompt: qs.stem || '（题目内容）',
    studentAnswer: g.student_answer || (verdict === 'analysis_only' ? '（未检测到作答）' : hasAnswer ? '（未识别）' : '（未作答）'),
    correctAnswer,
    verdict,
    oneLine,
    steps,
    knowledgeReview,
    knowledgePoints: kpNames.length ? kpNames : ['待分析'],
    weakPoint: kpNames[0] || '—',
    errorType: g.error_type || '—',
    reviewSuggestions,
  };
}

function hasRenderableGrading(data) {
  const g = data?.grading || {};
  const analysis = data?.analysis || {};
  const hasCorrectAnswer = Boolean(
    (g.correct_answer && g.correct_answer !== '—') ||
    analysis.raw_correct_answer || analysis.solution_answer
  );
  const hasSteps = (Array.isArray(g.steps) && g.steps.length > 0) ||
    (Array.isArray(analysis.solution_steps) && analysis.solution_steps.length > 0);
  return hasCorrectAnswer || hasSteps;
}

    localStorage.removeItem('user_email');

  return (
    <div style={{

      boxShadow:'0 10px 30px -28px rgba(18,32,61,.35)',

        fontSize:15.5, fontWeight:750,
        color:'var(--text)',
        letterSpacing:0,
        display:'flex', alignItems:'center', gap:7,
      }}>

// ═══════════════════════════════════════════════════════════════
// SVG 进度环
// ═══════════════════════════════════════════════════════════════
function ProgressRing({ pct, size=72, strokeWidth=6 }) {
  const r = (size - strokeWidth) / 2;
  const circ = 2 * Math.PI * r;
  const dash = circ * Math.min(Math.max(pct, 0), 100) / 100;
  return (
    <div style={{position:'relative', width:size, height:size, flex:'none'}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}
        style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r}
          stroke="rgba(255,255,255,0.25)" strokeWidth={strokeWidth} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r}
          stroke="#fff" strokeWidth={strokeWidth} fill="none"
          strokeLinecap="round"
          strokeDasharray={`${dash} ${circ}`}/>
      </svg>
      <div style={{
        position:'absolute', inset:0,
        display:'flex', flexDirection:'column',
        alignItems:'center', justifyContent:'center',
      }}>
        <span style={{fontSize:15, fontWeight:700, color:'#fff', lineHeight:1}}>{pct}%</span>
        <span style={{fontSize:9, color:'rgba(255,255,255,.75)', marginTop:2}}>完成</span>
      </div>
    </div>
  );
}

function CameraIllustration() {
  return (
    <div style={{
      width: 132,
      height: 132,
      borderRadius: '50%',
      overflow: 'hidden',
      background: 'radial-gradient(circle at 32% 24%, #FFFFFF 0%, #EEF3FF 54%, #E5ECFF 100%)',
      boxShadow: '0 18px 42px -26px rgba(76,103,240,.44)',
      border: '1px solid rgba(76,103,240,.12)',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      padding: 6,
      position: 'relative',
    }}>
      <div style={{
        position: 'absolute',
        inset: 0,
        borderRadius: '50%',
        boxShadow: 'inset 0 0 0 10px rgba(255,255,255,.26), inset 0 -18px 24px -22px rgba(76,103,240,.4)',
        pointerEvents: 'none',
      }} />
      <img
        src={CAMERA_ILLUSTRATION_DATA_URL}
        alt="AI教师图标"
        width="122"
        height="122"
        decoding="async"
        fetchpriority="high"
        style={{
          width: 122,
          height: 122,
          objectFit: 'cover',
          display: 'block',
          borderRadius: '50%',
          transform: 'translateZ(0)',
        }}
      />
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 公共组件
// ═══════════════════════════════════════════════════════════════
function SectionLabel({ title, action, onAction }) {
  return (
    <div style={{
      padding:'6px 22px 9px',
      display:'flex', alignItems:'baseline', justifyContent:'space-between',
    }}>
      <div style={{fontSize:13.5, fontWeight:750, color:'var(--text)', letterSpacing:0}}>{title}</div>
      {action && (
        <button onClick={onAction} style={{
          background:'transparent', border:'none', cursor:'pointer',
          fontSize:12.5, color:'var(--text-muted)', fontFamily:'inherit', padding:0,
        }}>{action}</button>
      )}
    </div>
  );
}

function Pill({ color='var(--text)', bg='#F2F3F6', children, size='sm' }) {
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:4,
      padding: size==='sm' ? '2px 8px' : '4px 10px',
      borderRadius:999, background:bg, color,
      fontWeight:650, fontSize: size==='sm' ? 11 : 12, whiteSpace:'nowrap',
      border:'1px solid rgba(255,255,255,.58)',
    }}>{children}</span>
  );
}

// ═══════════════════════════════════════════════════════════════
// Tab 栏（含滑动指示条）
// ═══════════════════════════════════════════════════════════════
function TabBar({ value, onChange }) {
  const tabs = [
    {id:'home',    label:'拍题',  icon:Ic.cam2},
    {id:'review',  label:'复习',  icon:Ic.rev},
    {id:'library', label:'知识库',icon:Ic.book},
    {id:'history', label:'错题本',icon:Ic.hist},
  ];
  const activeIdx = tabs.findIndex(t => t.id === value);

  return (
    <div style={{
      display:'flex', background:'rgba(255,255,255,.96)',
      borderTop:'1px solid rgba(229,234,242,.86)',
      padding:'6px 8px max(10px, env(safe-area-inset-bottom, 0px))',
      position:'absolute', left:0, right:0, bottom:0,
      zIndex:90,
      flex:'none',
      boxShadow:'0 -12px 34px -28px rgba(18,32,61,.46)',
    }}>
      {/* 滑动指示条 */}
      <div style={{
        position:'absolute', top:0, height:3,
        width:`${100 / tabs.length}%`,
        left:`${(activeIdx / tabs.length) * 100}%`,
        transition:'left .28s cubic-bezier(.4,0,.2,1)',
        display:'flex', justifyContent:'center',
        pointerEvents:'none',
      }}>
        <div style={{
          width:26, height:3,
          background:'var(--primary)',
          borderRadius:'0 0 4px 4px',
        }}/>
      </div>

      {tabs.map(t => {
        const active = value === t.id;
        return (
          <button key={t.id} onClick={() => onChange(t.id)}
            className="tab-btn"
            style={{
              flex:1, display:'flex', flexDirection:'column',
              alignItems:'center', gap:3,
              border:'none', background:'transparent', cursor:'pointer',
              color: active ? 'var(--primary)' : 'var(--text-faint)',
              padding:'8px 0 6px', fontFamily:'inherit',
              borderRadius:14,
            }}>
            <span style={{
              width:30, height:25, borderRadius:12,
              display:'flex', alignItems:'center', justifyContent:'center',
              background: active ? 'rgba(76,103,240,.09)' : 'transparent',
            }}>
              {t.icon(21)}
            </span>
            <span style={{fontSize:10.5, fontWeight: active ? 700 : 500}}>{t.label}</span>
          </button>
        );
      })}
    </div>
  );
}

  return (

      width:size, height:size, borderRadius:10, overflow:'hidden',
      background:'#FFF8E8', border:'1px solid #E8DCC0', flex:'none',

      <svg viewBox="0 0 100 100" width="100%" height="100%">
        {[15,30,45,60,75,90].map(y => <line key={y} x1="0" y1={y} x2="100" y2={y} stroke="#EDDCB0" strokeWidth="0.4"/>)}
        <line x1="10" y1="60" x2="90" y2="60" stroke="#3A3A3A" strokeWidth="1.4"/>
        {[12,22,32,42,52,62,72,82].map(x => <line key={x} x1={x} y1="61" x2={x+5} y2="68" stroke="#3A3A3A" strokeWidth="0.5"/>)}
        <line x1="22" y1="22" x2="50" y2="60" stroke="#C04A4A" strokeWidth="1.6"/>
        <polygon points="49,60 44,55 47,59" fill="#C04A4A"/>
        <path d="M 50 55 A 8 8 0 0 0 44 60" fill="none" stroke="#1F4A6B" strokeWidth="0.7"/>
        <text x="38" y="56" fontSize="6.5" fill="#1F4A6B" fontWeight="600">30°</text>
        <text x="51" y="68" fontSize="6.5" fill="#15161B" fontWeight="700">O</text>
        <text x="19" y="20" fontSize="6.5" fill="#15161B" fontWeight="700">A</text>
      </svg>
    </div>
  );
}

      </div>

function ChatMessage({ msg, onViewResult }) {
  if (msg.type === 'photo') {
    return (
      <div style={{display:'flex', justifyContent:'flex-end'}}>
        <div style={{
          background:'var(--primary)', color:'#fff',
          padding:8, borderRadius:18, borderBottomRightRadius:4,
          maxWidth:'75%', display:'flex', flexDirection:'column', gap:6,
        }}>
          {msg.previewUrl
            ? <img src={msg.previewUrl} alt="题目图片"
                style={{width:200, borderRadius:10, display:'block', objectFit:'contain', maxHeight:260}}/>
            : <QuestionThumb size={140}/>}
          <div style={{fontSize:11.5, opacity:.75, padding:'0 2px'}}>{msg.caption||'已发送题目'}</div>
        </div>
      </div>
    );
  }
  if (msg.type === 'grading') {
    return (
      <div style={{display:'flex', justifyContent:'flex-start'}}>
        <InlinePipelineCard msg={msg} onViewResult={onViewResult}/>
      </div>
    );
  }
  if (msg.role === 'user') {
    return (
      <div style={{display:'flex', justifyContent:'flex-end'}}>
        <div style={{
          background:'var(--primary)', color:'#fff',
          padding:'10px 14px', borderRadius:18, borderBottomRightRadius:4,
          fontSize:14, lineHeight:1.65, maxWidth:'80%',
        }}>{msg.text}</div>
      </div>
    );
  }
  const content = normalizeChatText(stripAiIntro(msg.text||''));
  const segments = content.split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (segments.length === 0) {
    return (
      <div style={{display:'flex', justifyContent:'flex-start'}}>
        <div style={{
          background:'#fff', border:'1px solid var(--border)',
          padding:'10px 14px', borderRadius:18, borderBottomLeftRadius:4,
          fontSize:14, color:'var(--text-faint)',
        }}>{msg.streaming ? <span>等我思考一下</span> : null}</div>
      </div>
    );
  }
  return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'flex-start', gap:16}}>
      {segments.map((seg, i) => {
        const isLast = i === segments.length - 1;
        return (
          <div key={i} className="stream-line" style={{
            background:'#fff', border:'1px solid var(--border)',
            padding:'10px 14px', borderRadius:18,
            borderBottomLeftRadius: isLast ? 4 : 18,
            fontSize:14, lineHeight:1.65, maxWidth:'80%',
          }}>
            <ChatRichText text={seg} streaming={msg.streaming && isLast}/>
          </div>
        );
      })}
    </div>
  );
}

function ChatRichText({ text, streaming }) {
  const content = normalizeChatText(stripAiIntro(text||''));
  if (!content && streaming) {
    return <span style={{color:'var(--text-faint)'}}>正在生成<span className="caret"/></span>;
  }
  const blocks = splitRichText(content);
  if (blocks.length === 0) return null;
  return (
    <div style={{display:'flex', flexDirection:'column', gap:9}}>
      {blocks.map((block, i) => block.type === 'formula' ? (
        <div key={i} style={{
          padding:'7px 9px', borderRadius:9,
          background:'#F7F8FA', border:'1px solid var(--border)',
          color:'var(--text)', fontSize:12.5, lineHeight:1.55,
          overflowX:'auto',
          fontFamily:'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
        }}><FormulaText text={block.text}/></div>
      ) : (
        <p key={i} style={{
          margin:0, color:'var(--text)', fontSize:13.3,
          lineHeight:1.95, textAlign:'left', letterSpacing:0,
        }}>{block.text}{streaming && i===blocks.length-1 && <span className="caret"/>}</p>
      ))}
    </div>
  );
}

function normalizeChatText(text) {
  return String(text||'')
    .replace(/\s+/g,' ')
    .replace(/(^|\s)最终\s*(?=答案[:：])/g,'$1')
    .replace(/([。；])\s*(?=(第一步|第二步|第三步|第四步|先看|再看|答案[:：]|对应选项|根据牛顿第三定律))/g,'$1\n')
    .replace(/\s*(答案[:：])/g,'\n$1')
    .replace(/([。；])\s*/g,'$1\n')
    .replace(/\n{2,}/g,'\n')
    .trim();
}

function stripAiIntro(text) {
  return String(text||'')
    .replace(/^我是你的AI物理老师[，,。！!\s]*/g,'')
    .replace(/^我是你的 AI 物理老师[，,。！!\s]*/g,'')
    .replace(/^我是你的AI物理学习助手[，,。！!\s]*/g,'')
    .replace(/^我是你的 AI 物理学习助手[，,。！!\s]*/g,'')
    .replace(/^咱们用整体法分析哦[，,。！!\s]*/g,'')
    .replace(/^咱们回到这道题[，,。！!\s]*/g,'')
    .trim();
}

// Page · 知识库（物理知识图谱 + 学习报告）
// ═══════════════════════════════════════════════════════════════
function PhysicsGraphPage() {
  const [sel, setSel]                 = useState(null);
  const [pageTab, setPageTab]         = useState('graph');
  const [apiMastery, setApiMastery]   = useState({});
  const [reportData, setReportData]   = useState(null);
  const [reportLoading, setReportLoading] = useState(false);
  const svgRef = useRef(null);

  const nodes = useMemo(() => PHYS_NODES.map(n => {
    if (n.isSubject || !(n.name in apiMastery)) return n;
    return { ...n, mastery: apiMastery[n.name] };
  }), [apiMastery]);

  const nodesById = useMemo(() => Object.fromEntries(nodes.map(n => [n.id, n])), [nodes]);

  useEffect(() => {
    apiGet('/api/knowledge-graph/graph?subject=物理')
      .then(data => {
        if (!data || !data.nodes) return;
        const m = {};
        data.nodes.forEach(n => { if (n.mastery != null) m[n.name] = Math.round(n.mastery * 100); });
        if (Object.keys(m).length) setApiMastery(m);
      }).catch(() => {});
  }, []);

  const fetchReport = async (force=false) => {
    setReportLoading(true);
    try {
      const url = `/api/knowledge-graph/report${force?'/refresh':''}?subject=物理`;
      const r = await fetch(url, {
        method: force ? 'POST' : 'GET',
        headers: {'X-Student-Id': STUDENT_ID},
      });
      if (r.ok) setReportData(await r.json());
    } catch(e) {}
    setReportLoading(false);
  };

  useEffect(() => { if (pageTab==='report' && !reportData) fetchReport(); }, [pageTab]);

  const relatedIds = useMemo(() => {
    if (!sel) return null;
    const ids = new Set([sel]);
    PHYS_EDGES.forEach(([a,b]) => { if (a===sel) ids.add(b); if (b===sel) ids.add(a); });
    return ids;
  }, [sel]);

  useEffect(() => {
    if (pageTab !== 'graph') return;
    let raf;
    const start = performance.now();
    function tick(now) {
      const t = (now - start) / 1000;
      const svg = svgRef.current;
      if (!svg) return;
      const offsets = {};
      nodes.forEach((n, i) => {
        const dx = Math.sin(t * 0.45 + i * 0.7) * 1.0;
        const dy = Math.cos(t * 0.38 + i * 1.1) * 1.0;
        offsets[n.id] = [dx, dy];
        const g = svg.querySelector(`[data-nid="${n.id}"]`);
        if (g) g.style.transform = `translate(${(n.x+dx).toFixed(2)}px, ${(n.y+dy).toFixed(2)}px)`;
      });
      PHYS_EDGES.forEach(([a,b], i) => {
        const ln = svg.querySelector(`[data-eid="${i}"]`);
        if (!ln) return;
        const A = nodesById[a], B = nodesById[b];
        const [adx,ady] = offsets[a]||[0,0];
        const [bdx,bdy] = offsets[b]||[0,0];
        ln.setAttribute('x1', A.x+adx); ln.setAttribute('y1', A.y+ady);
        ln.setAttribute('x2', B.x+bdx); ln.setAttribute('y2', B.y+bdy);
      });
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [nodesById, pageTab]);

  const PHYS_COLOR = '#6575F4';
  const totalKp = nodes.length - 1;

  return (
    <div className="scroll" style={{flex:1, overflowY:'auto', padding:'0 0 96px'}}>
      <div style={{padding:'13px 22px 0', display:'flex', alignItems:'center', gap:8}}>
        <div style={{
          padding:'4px 11px', borderRadius:999, fontSize:12, fontWeight:750,
          background:'var(--primary-soft)', color:'var(--primary-deep)',
          border:'1px solid rgba(76,103,240,.20)',
        }}>物理</div>
        <div style={{fontSize:12.5, color:'var(--text-muted)'}}>
          {totalKp} 个知识点 · {PHYS_EDGES.length} 条关联
        </div>
        <div style={{marginLeft:'auto', fontSize:11.5, color:'var(--text-faint)'}}>
          {pageTab==='graph' ? '点击节点查看详情' : ''}
        </div>
      </div>

      <div style={{
        display:'flex', margin:'10px 22px 12px',
        background:'#EEF2F7', borderRadius:13, padding:3,
        border:'1px solid rgba(229,234,242,.72)',
      }}>
        {[['graph','知识图谱'],['report','学习报告']].map(([id,label]) => (
          <button key={id} onClick={() => setPageTab(id)} style={{
            flex:1, padding:'7px 0', border:'none', cursor:'pointer', borderRadius:10,
            fontSize:13, fontWeight: pageTab===id ? 650 : 500,
            background: pageTab===id ? '#fff' : 'transparent',
            color: pageTab===id ? 'var(--text)' : 'var(--text-faint)',
            boxShadow: pageTab===id ? '0 8px 18px -16px rgba(18,32,61,.45)' : 'none',
            transition:'all .18s', fontFamily:'inherit',
          }}>{label}</button>
        ))}
      </div>

      {pageTab === 'graph' ? (<>
        <div style={{
          position:'relative', margin:'0 12px', borderRadius:22, overflow:'hidden',
          background:'linear-gradient(180deg, #FFFFFF 0%, #F8FAFF 100%)',
          border:'1px solid rgba(76,103,240,.16)',
          boxShadow:'var(--shadow-soft)',
        }}>
          <div style={{
            position:'absolute', inset:0, pointerEvents:'none',
            backgroundImage:'radial-gradient(rgba(76,103,240,.13) 1px, transparent 1px)',
            backgroundSize:'16px 16px', opacity:.42,
          }}/>
          <svg ref={svgRef} viewBox="0 0 360 380" width="100%" style={{display:'block', height:'auto', position:'relative'}}
            onClick={() => setSel(null)}>
            {PHYS_EDGES.map(([a,b,kind], i) => {

              const inHL = !relatedIds || (relatedIds.has(a) && relatedIds.has(b));
              return (
                <line key={i} data-eid={i}
                  x1={A.x} y1={A.y} x2={B.x} y2={B.y}
                  stroke={inHL && relatedIds ? '#667085' : '#CBD5E1'}
                  strokeWidth={kind==='primary' ? 1.25 : 1}
                  strokeDasharray={kind==='dashed' ? '3 4' : null}
                  strokeLinecap="round"
                  opacity={relatedIds ? (inHL ? .86 : .11) : (kind==='primary' ? .52 : kind==='dashed' ? .38 : .44)}
                  style={{transition:'opacity .3s, stroke .3s'}}/>
              );
            })}
            {nodes.map(n => {
              const isSel = sel===n.id;
              const dim = relatedIds && !relatedIds.has(n.id);
              const lvl = n.isSubject ? null : masteryLevel(n.mastery);
              const labelLines = n.isSubject ? [n.name] : splitLabel(n.name);
              return (
                <g key={n.id} data-nid={n.id}
                  style={{cursor:'pointer', opacity: dim ? .28 : 1, transition:'opacity .3s', transform:`translate(${n.x}px,${n.y}px)`, willChange:'transform'}}

                  {isSel && <circle r={n.r+10} fill={n.isSubject ? PHYS_COLOR : lvl.color} opacity=".18"/>}
                  {n.isSubject ? (<>
                    <circle r={n.r} fill={PHYS_COLOR} style={{filter:'drop-shadow(0 12px 16px rgba(76,103,240,.24))'}}/>

                      style={{fontFamily:'inherit', letterSpacing:0}}>{n.name}</text>
                  </>) : (<>
                    <circle r={n.r} fill="#fff" stroke={isSel ? lvl.color : 'rgba(76,103,240,.34)'} strokeWidth={isSel ? 2.4 : 1.2}/>
                    <MasteryArc r={n.r-2} pct={n.mastery} color={lvl.color}/>
                    <circle cx={n.r-5} cy={-n.r+5} r="4.5" fill={lvl.color} stroke="#fff" strokeWidth="1.5"/>

                        style={{fontFamily:'inherit'}}>{line}</text>
                    ))}
                  </>)}
                </g>
              );
            })}
          </svg>
        </div>
        <div style={{padding:'12px 18px 0'}}>
          {sel && sel !== 'p0' ? (
            <NodeDetail node={nodesById[sel]} onClose={() => setSel(null)}/>
          ) : (
            <div style={{
              padding:'12px 14px', borderRadius:16,
              background:'#fff', border:'1px solid var(--border-soft)',
              boxShadow:'var(--shadow-card)',
              display:'flex', alignItems:'center', gap:10,

function splitLabel(name) {
  if (name.includes('·')) return name.split('·').map(s => s.trim());
  if (name.length > 4) { const mid = Math.ceil(name.length/2); return [name.slice(0,mid), name.slice(mid)]; }
  return [name];
}

function MasteryArc({ r, pct, color }) {
  const c = 2*Math.PI*r;
  return (
    <circle r={r} fill="none" stroke={color} strokeWidth="2"
      strokeLinecap="round" strokeDasharray={`${c*(pct/100)} ${c}`}
      transform="rotate(-90)" opacity=".62"/>
  );
}

function makePreviewText(text, maxLen=118) {
  const clean = String(text||'').replace(/\s+/g,' ').replace(/^\s*[，,、；;。.\s]+/,'').trim();
  if (clean.length <= maxLen) return clean;
  const slice = clean.slice(0, maxLen);
  const boundary = Math.max(slice.lastIndexOf('。'), slice.lastIndexOf('；'), slice.lastIndexOf('，'), slice.lastIndexOf('、'));
  if (boundary >= 36) return slice.slice(0, boundary+1);
  return slice.replace(/[，,、；;。.\s]+$/,'') + '…';
}

function getScriptedStreamState(elapsedMs) {
  if (elapsedMs < 0) return {streamCount:0};
  const count = elapsedMs < 400
    ? 0 : Math.min(STREAM_LINES.length, Math.floor((elapsedMs-400)/1600)+1);
  return {streamCount:count};
}

function InlinePipelineCard({ msg, onViewResult }) {
  const [nowMs, setNowMs] = useState(Date.now());
  const startedAt = msg.startedAt || nowMs;
  const elapsedMs = Math.max(0, nowMs - startedAt);
  const totalAnimMs = PIPELINE.reduce((sum,s) => sum+s.dur, 0);
  const animDone = elapsedMs >= totalAnimMs;
  const bgMode = elapsedMs >= 3*60*1000;

  let timerStep=0, accMs=0;
  PIPELINE.forEach((s,i) => { accMs+=s.dur; if (elapsedMs>=accMs) timerStep=i+1; });

  const solveStart = PIPELINE.slice(0,1).reduce((a,s) => a+s.dur, 0);
  const {streamCount} = getScriptedStreamState(elapsedMs - solveStart);
  const step = timerStep;

  useEffect(() => {
    if (msg.resultReady || msg.failed) return undefined;
    const timer = setInterval(() => setNowMs(Date.now()), 250);
    return () => clearInterval(timer);
  }, [msg.resultReady, msg.failed]);

  const canView = msg.resultReady;

  if (bgMode && !canView && !msg.failed) {
    return (
      <div style={{maxWidth:'88%'}}>
        <div className="card" style={{padding:'10px 14px', display:'flex', alignItems:'center', gap:10}}>
          <div style={{
            width:20, height:20, borderRadius:'50%', flex:'none',
            border:'2.5px solid var(--border)', borderTopColor:'var(--primary)',
            animation:'spin 1s linear infinite',
          }}/>
          <div style={{flex:1}}>
            <div style={{fontSize:13, fontWeight:600, color:'var(--text)'}}>AI 还在解题中</div>

              题目较复杂，完成后会在历史记录里出现

        </div>

  }

  return (
    <div style={{maxWidth:'88%'}}>
      <div className="card" style={{padding:'12px 14px'}}>
        {PIPELINE.map((s, i) => {
          const state = i<step ? 'done' : i===step ? 'current' : 'pending';
          const isLast = i===PIPELINE.length-1;
          return (
            <div key={s.id} style={{display:'flex', gap:10}}>
              <div style={{display:'flex', flexDirection:'column', alignItems:'center', paddingTop:3, flex:'none'}}>
                <div className={'step-dot '+state} style={{width:22, height:22, fontSize:10.5}}>

                    ? <span className="check-pop">{Ic.check(11)}</span>
                    : <span style={{opacity:state==='pending'?.6:1}}>{i+1}</span>}
                </div>
                {!isLast && <div className={'step-line '+state} style={{minHeight:10}}/>}
              </div>
              <div style={{flex:1, paddingTop:3, paddingBottom:isLast?0:10}}>
                <div style={{
                  fontSize:13, fontWeight:state==='pending'?500:700,
                  color:state==='pending'?'var(--text-faint)':'var(--text)',
                }}>{s.title}</div>
                {state!=='pending' && s.streaming && (
                  <StreamingContent lines={STREAM_LINES.slice(0,streamCount)} showing={state==='current'}/>
                )}
                {state!=='pending' && s.detail && (
                  <div style={{marginTop:3, fontSize:12, color:'var(--text-muted)', lineHeight:1.5}}>{s.detail}</div>
                )}
              </div>
            </div>
          );
        })}
        {msg.failed && (
          <div style={{marginTop:10, padding:'8px 10px', borderRadius:10, background:'var(--error-soft)', color:'var(--error)', fontSize:12.5}}>
            {msg.failMsg||'批改未通过，请重试'}

        )}
        {animDone && !msg.resultReady && !msg.failed && (
          <div style={{
            marginTop:10, padding:'9px 10px', borderRadius:12,
            background:'var(--surface)', border:'1px solid var(--border)',
            fontSize:12, color:'var(--text-muted)', lineHeight:1.5,
          }}>
            AI 老师正在整理答案，可前往历史查看详细解析
          </div>
        )}
        {canView && <ResultMiniCard data={msg.resultData} onViewResult={onViewResult}/>}
      </div>
    </div>
  );
}

// ─── 辅助组件 ──────────────────────────────────────────────────
function RichStepText({ text }) {
  const blocks = splitRichText(text||'');
  if (blocks.length === 0) return null;
  return (
    <div style={{marginTop:7, display:'flex', flexDirection:'column', gap:9}}>
      {blocks.map((block, i) => block.type==='formula' ? (
        <div key={i} style={{
          margin:'3px 0 5px', padding:'9px 11px', borderRadius:10,
          background:'#F7F8FA', border:'1px solid var(--border)',
          color:'var(--text)', fontSize:13, lineHeight:1.65,
          overflowX:'auto', whiteSpace:'pre-wrap', wordBreak:'break-word',
          fontFamily:'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
        }}><FormulaText text={block.text}/></div>
      ) : (
        <p key={i} style={{
          margin:0, color:'#5A5C65', fontSize:12.8, lineHeight:1.9,
          textIndent:'2em', textAlign:'justify',
        }}>{block.text}</p>
      ))}
    </div>
  );
}

function splitRichText(text) {
  const normalized = String(text).replace(/\r\n/g,'\n').replace(/；\s*/g,'；\n').replace(/。\s*/g,'。\n');
  const lines = normalized.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const blocks = [];
  lines.forEach(line => {
    const parts = line.split(/(\$[^$]+\$|\\frac\{[^}]+\}\{[^}]+\}|[A-Za-z][A-Za-z0-9_]*\s*=\s*[A-Za-z0-9+\-*/().\s×·\\=<>_^]+)/g)
      .map(s=>s.trim()).filter(Boolean);
    parts.forEach((part, partIndex) => {
      if (isStandaloneFormula(part)) blocks.push({type:'formula',text:part});
      else pushTextBlock(blocks, part, partIndex>0);
    });
  });
  return blocks;
}

function pushTextBlock(blocks, text, mergeWithPrevious=true) {
  const previous = blocks[blocks.length-1];
  let clean = normalizeInlineMath(text).trim();
  if (previous && previous.type==='formula') clean = clean.replace(/^[，,、；;。.\s]+/,'').trim();
  if (!clean) return;
  if (mergeWithPrevious && previous && previous.type==='text') {
    const needsSpace = /[A-Za-z0-9]$/.test(previous.text) && /^[A-Za-z0-9]/.test(clean);
    previous.text += `${needsSpace?' ':''}${clean}`;
  } else {
    blocks.push({type:'text',text:clean});
  }
}

function isStandaloneFormula(part) {
  const clean = String(part).trim().replace(/^\$|\$$/g,'');
  if (/^\\?[A-Za-z]$/.test(clean)) return false;
  if (/^[A-Za-z]$/.test(clean)) return false;
  return /\\frac|[A-Za-z][A-Za-z0-9_]*\s*=|[=<>]|\\cdot|\\times/.test(clean);
}

function FormulaText({ text }) {
  const tokens = parseFormulaTokens(normalizeFormula(text));
  return (
    <span style={{display:'inline-flex', alignItems:'center', gap:3, flexWrap:'wrap'}}>
      {tokens.map((token, i) => token.type==='frac' ? (
        <span key={i} style={{
          display:'inline-flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center',
          verticalAlign:'middle', margin:'0 2px',
          lineHeight:1.05, fontSize:12.5,
        }}>
          <span style={{padding:'0 4px 2px'}}>{token.num}</span>
          <span style={{width:'100%', minWidth:18, borderTop:'1.5px solid currentColor'}}/>
          <span style={{padding:'2px 4px 0'}}>{token.den}</span>
        </span>
      ) : (
        <span key={i}>{token.text}</span>
      ))}
    </span>
  );
}

function parseFormulaTokens(text) {
  const tokens = [];
  const re = /\\frac\{([^}]+)\}\{([^}]+)\}|([A-Za-z][A-Za-z0-9]*(?:\([^)]+\)[A-Za-z0-9]*)?|[0-9]+(?:\.[0-9]+)?)\/([A-Za-z][A-Za-z0-9]*(?:\([^)]+\)[A-Za-z0-9]*)?|[0-9]+(?:\.[0-9]+)?)/g;
  let last=0, match;
  while ((match=re.exec(text))!==null) {
    if (match.index>last) tokens.push({type:'text',text:text.slice(last,match.index)});
    if (match[1]!==undefined) tokens.push({type:'frac',num:normalizeInlineMath(match[1]),den:normalizeInlineMath(match[2])});
    else tokens.push({type:'frac',num:match[3],den:match[4]});
    last = match.index+match[0].length;
  }
  if (last<text.length) tokens.push({type:'text',text:text.slice(last)});
  return tokens;
}

function normalizeFormula(text) {
  return String(text).replace(/^\$|\$$/g,'').replace(/\\cdot/g,'·').replace(/\\times/g,'×')
    .replace(/\\\(/g,'').replace(/\\\)/g,'').replace(/([A-Za-z])\*([A-Za-z(])/g,'$1$2').replace(/\*/g,'×');
}
function normalizeInlineMath(text) {
  return String(text).replace(/\\cdot/g,'·').replace(/\\times/g,'×').replace(/^\$|\$$/g,'');
}

function cropImageFile(file, imageUrl, rectPct) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const sx = Math.max(0, Math.round(img.naturalWidth * rectPct.x / 100));
      const sy = Math.max(0, Math.round(img.naturalHeight * rectPct.y / 100));
      const sw = Math.max(1, Math.round(img.naturalWidth * rectPct.w / 100));
      const sh = Math.max(1, Math.round(img.naturalHeight * rectPct.h / 100));
      const canvas = document.createElement('canvas');
      canvas.width = sw;
      canvas.height = sh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      canvas.toBlob((blob) => {
        if (!blob) {
          reject(new Error('裁剪失败'));
          return;
        }
        const ext = blob.type === 'image/png' ? 'png' : 'jpg';
        const base = (file.name || 'question').replace(/\.[^.]+$/, '');
        resolve(new File([blob], `${base}-crop.${ext}`, { type: blob.type || 'image/jpeg' }));
      }, file.type && file.type.includes('png') ? 'image/png' : 'image/jpeg', 0.92);
    };
    img.onerror = () => reject(new Error('图片读取失败'));
    img.src = imageUrl;
  });
}

function CropQuestionScreen({ draft, onCancel, onUseWhole, onConfirm }) {
  const [rect, setRect] = useState({x:8, y:18, w:84, h:54});
  const [working, setWorking] = useState(false);
  const dragRef = useRef(null);

  useEffect(() => {
    const minSize = 10;
    const limit = (value, min, max) => Math.max(min, Math.min(max, value));
    const tidy = (value) => Math.round(value * 10) / 10;
    function onMove(ev) {
      const d = dragRef.current;
      if (!d) return;
      const point = ev.touches ? ev.touches[0] : ev;
      if (!point) return;
      ev.preventDefault && ev.preventDefault();
      const dx = (point.clientX - d.startX) / d.box.width * 100;
      const dy = (point.clientY - d.startY) / d.box.height * 100;
      const r = d.startRect;
      let next = {...r};
      if (d.mode === 'move') {
        next.x = limit(r.x + dx, 0, 100 - r.w);
        next.y = limit(r.y + dy, 0, 100 - r.h);
      } else {
        const right = r.x + r.w;
        const bottom = r.y + r.h;
        if (d.mode.includes('l')) {
          next.x = limit(r.x + dx, 0, right - minSize);
          next.w = right - next.x;
        }
        if (d.mode.includes('r')) {
          next.w = limit(r.w + dx, minSize, 100 - r.x);
        }
        if (d.mode.includes('t')) {
          next.y = limit(r.y + dy, 0, bottom - minSize);
          next.h = bottom - next.y;
        }
        if (d.mode.includes('b')) {
          next.h = limit(r.h + dy, minSize, 100 - r.y);
        }
      }
      setRect({x:tidy(next.x), y:tidy(next.y), w:tidy(next.w), h:tidy(next.h)});
    }
    function onUp() { dragRef.current = null; }
    document.addEventListener('mousemove', onMove, {passive:false});
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
    document.addEventListener('touchcancel', onUp);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      document.removeEventListener('touchcancel', onUp);
    };
  }, []);

  function beginDrag(mode, ev) {
    const point = ev.touches ? ev.touches[0] : ev;
    if (!point) return;
    const box = ev.currentTarget.closest('[data-crop-box]').getBoundingClientRect();
    dragRef.current = {
      mode,
      startX: point.clientX,
      startY: point.clientY,
      box,
      startRect: {...rect},
    };
    ev.stopPropagation && ev.stopPropagation();
    ev.preventDefault && ev.preventDefault();
  }

  async function confirmCrop() {
    if (working) return;
    setWorking(true);
    try {
      const cropped = await cropImageFile(draft.file, draft.previewUrl, rect);
      const croppedUrl = URL.createObjectURL(cropped);
      onConfirm(cropped, croppedUrl);
    } catch (err) {
      wxToastFallback(err.message || '裁剪失败');
      setWorking(false);
    }
  }

  function wxToastFallback(text) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  const handle = (mode, style) => (
    <div onMouseDown={(e)=>beginDrag(mode,e)} onTouchStart={(e)=>beginDrag(mode,e)} style={{
      position:'absolute', width:44, height:44, borderRadius:'50%',
      display:'flex', alignItems:'center', justifyContent:'center',
      touchAction:'none', zIndex:4,
      ...style,
    }}>
      <span style={{
        width:24, height:24, borderRadius:'50%',
        background:'#fff', border:'2px solid var(--primary)',
        boxShadow:'0 6px 18px rgba(15,23,42,.22)',
        display:'block',
      }}/>
    </div>
  );

  return (
    <div className="overlay open" style={{zIndex:180, background:'#0f172a'}}>
      <div style={{
        height:'calc(env(safe-area-inset-top, 0px) + 54px)',
        paddingTop:'env(safe-area-inset-top, 0px)',
        flex:'none', display:'flex', alignItems:'center', justifyContent:'space-between',
        paddingLeft:16, paddingRight:16, color:'#fff',
      }}>
        <button onClick={onCancel} style={{border:'none', background:'rgba(255,255,255,.12)', color:'#fff', borderRadius:999, padding:'8px 12px'}}>取消</button>
        <div style={{fontSize:15, fontWeight:700}}>框选一道题</div>
        <button onClick={onUseWhole} style={{border:'none', background:'rgba(255,255,255,.12)', color:'#fff', borderRadius:999, padding:'8px 12px'}}>用整张</button>
      </div>

      <div style={{flex:1, minHeight:0, padding:'10px 14px 12px', display:'flex', flexDirection:'column'}}>
        <div style={{
          flex:1, minHeight:0, position:'relative', borderRadius:18, overflow:'hidden',
          background:'#020617', display:'flex', alignItems:'center', justifyContent:'center',
          touchAction:'none',
        }}>
          <div data-crop-box style={{
            position:'relative',
            maxWidth:'100%',
            maxHeight:'100%',
            display:'flex',
            alignItems:'center',
            justifyContent:'center',
          }}>
            <img src={draft.previewUrl} style={{
              maxWidth:'100%', maxHeight:'100%', width:'auto', height:'auto', display:'block',
              userSelect:'none', WebkitUserSelect:'none', pointerEvents:'none',
            }}/>
            <div style={{position:'absolute', inset:0, background:'rgba(2,6,23,.42)', pointerEvents:'none'}}/>
            <div onMouseDown={(e)=>beginDrag('move',e)} onTouchStart={(e)=>beginDrag('move',e)} style={{
              position:'absolute',
              left:`${rect.x}%`, top:`${rect.y}%`, width:`${rect.w}%`, height:`${rect.h}%`,
              border:'2px solid #fff', borderRadius:12,
              boxShadow:'0 0 0 9999px rgba(2,6,23,.46), 0 0 0 1px var(--primary) inset',
              cursor:'move', touchAction:'none',
            }}>
              <div style={{
                position:'absolute', left:0, right:0, top:'50%', borderTop:'1px dashed rgba(255,255,255,.7)'
              }}/>
              <div style={{
                position:'absolute', top:0, bottom:0, left:'50%', borderLeft:'1px dashed rgba(255,255,255,.7)'
              }}/>
              <div style={{
                position:'absolute', left:8, top:8, background:'rgba(79,110,247,.92)', color:'#fff',
                padding:'4px 8px', borderRadius:999, fontSize:12, fontWeight:700,
              }}>拖动或缩放框选区域</div>
              {handle('lt', {left:-22, top:-22})}
              {handle('rt', {right:-22, top:-22})}
              {handle('lb', {left:-22, bottom:-22})}
              {handle('rb', {right:-22, bottom:-22})}
            </div>
          </div>
        </div>

        <div style={{flex:'none', padding:'12px 2px max(12px, env(safe-area-inset-bottom, 0px))'}}>
          <div style={{color:'rgba(255,255,255,.72)', fontSize:12.5, textAlign:'center', marginBottom:10}}>
            建议只框住一道题，避免多题混在一起影响批改
          </div>
          <button onClick={confirmCrop} disabled={working} className="fab-btn" style={{
            width:'100%', borderRadius:18, padding:'15px 0', fontSize:16, fontWeight:800,
            opacity:working ? .72 : 1,
          }}>
            {working ? '正在裁剪…' : '使用框选区域'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// 主应用
// ═══════════════════════════════════════════════════════════════
function App() {
  const [tab,           setTab]           = useState('home');
  const [tasks,         setTasks]         = useState(TODAY_TASKS);
  const [history,       setHistory]       = useState([]);
  const [grading,       setGrading]       = useState(null);
  const [gradingResult, setGradingResult] = useState(null);
  const [toast,         setToast]         = useState(null);
  const [chatMessages,  setChatMessages]  = useState([]);
  const [currentAid,    setCurrentAid]    = useState(null);
  const [cropDraft,     setCropDraft]     = useState(null);
  const fileInputRef    = useRef(null);
  const streamQueuesRef = useRef({});

  function refreshHistory() {
    return apiGet('/api/students/'+STUDENT_ID+'/assignments')
      .then(data => {
        const mapped = (data.items||[]).map(item => ({
          id:      item.assignment_id,
          chapter: SUBJECT_NAMES[item.subject_id]||'物理',
          title:   item.title||'未命名作业',
          verdict: item.verdict||(item.status==='ai_done'||item.status==='graded'?'analysis_only':'empty'),
          time:    item.time_display||'刚刚',
          status:  item.status,
        }));
        if (mapped.length) setHistory(mapped);
      }).catch(()=>{});
  }
  useEffect(() => { refreshHistory(); }, []);

  function startPoll(aid, title, progressId) {
    const STATUS_STEP = {uploaded:0,ocr_queued:0,ocr_running:1,ocr_done:2,ai_running:3};
    let tries=0;
    const startMs = Date.now();
    async function check() {
      tries++;
      const elapsed = Date.now() - startMs;
      const interval = elapsed < 3*60*1000 ? 5000 : 15000;
      if (elapsed > 20*60*1000) {
        setChatMessages(m => m.map(msg => msg._id===progressId
          ? {...msg, failed:true, failMsg:'批改超时，请在历史记录重新上传'} : msg));
        return;
      }
      try {
        const data = await apiGet('/api/grading/'+aid);
        const st = (data.status||'').toLowerCase();
        const currentStep = STATUS_STEP[st]??0;
        setChatMessages(m => m.map(msg => msg._id===progressId ? {...msg, currentStep} : msg));
        if (st==='ai_done' && hasRenderableGrading(data)) {
          const result = mapGradingToResult(data, title);
          setChatMessages(m => m.map(msg => msg._id===progressId
            ? {...msg, currentStep:5, resultReady:true, resultData:result} : msg));
          refreshHistory();
        } else if (st==='ai_done') {
          setChatMessages(m => m.map(msg => msg._id===progressId ? {...msg, currentStep:4} : msg));
          setTimeout(check, interval);
        } else if (st==='manual_required') {
          const reason = data.analysis?.support_status||'';
          const failMsg = reason==='unsupported_subject' ? '题目学科暂不支持 AI 批改'
            : reason==='unsupported_grade' ? '年级暂不支持 AI 批改' : '题目暂不支持 AI 批改';
          setChatMessages(m => m.map(msg => msg._id===progressId ? {...msg, failed:true, failMsg} : msg));
        } else if (st==='ai_failed'||st==='failed') {
          setChatMessages(m => m.map(msg => msg._id===progressId
            ? {...msg, failed:true, failMsg:'批改出错，请重试'} : msg));
        } else { setTimeout(check, interval); }
      } catch(_) { if (Date.now()-startMs < 20*60*1000) setTimeout(check, interval); }
    }
    setTimeout(check, 2000);
  }

  function onCameraClick() { fileInputRef.current && fileInputRef.current.click(); }

  function onFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    e.target.value = '';
    setGradingResult(null);
    const title = file.name.replace(/\.[^.]+$/,'')||'作业';
    const previewUrl = URL.createObjectURL(file);
    setCropDraft({file, title, previewUrl});
  }

  function uploadPreparedFile(file, title, previewUrl) {
    const progressId = Date.now();
    const startedAt = Date.now();
    const fd = new FormData();
    fd.append('file', file);
    apiUpload(fd)
      .then(up => apiPost('/api/grading/'+up.assignment_id+'/start',{}).then(()=>up.assignment_id).catch(()=>up.assignment_id))
      .then(aid => {
        setCurrentAid(aid);
        const explainId = progressId+1;
        const explainPrompt = '请直接看图讲解这道题，边分析边输出：先说题型和条件，再一步步推导，最后给答案。不要等完整结论再开始。';
        setChatMessages(m => [...m,
          {type:'photo', caption:title, previewUrl},
          {type:'grading', _id:progressId, title, startedAt},
          {role:'ai', text:'', _id:explainId, streaming:true},
        ]);
        streamAiMessage(aid, explainPrompt, explainId);
        startPoll(aid, title, progressId);
      })
      .catch(() => { URL.revokeObjectURL(previewUrl); showToast('上传失败，请重试'); });
  }

  function cancelCrop() {
    if (cropDraft?.previewUrl) URL.revokeObjectURL(cropDraft.previewUrl);
    setCropDraft(null);
  }

  function useWholeImage() {
    if (!cropDraft) return;
    const draft = cropDraft;
    setCropDraft(null);
    uploadPreparedFile(draft.file, draft.title, draft.previewUrl);
  }

  function useCroppedImage(file, previewUrl) {
    if (!cropDraft) return;
    const title = cropDraft.title;
    URL.revokeObjectURL(cropDraft.previewUrl);
    setCropDraft(null);
    uploadPreparedFile(file, title, previewUrl);
  }

  function closeResult()        { setGrading(null); setGradingResult(null); }
  function onViewResult(rd)     { setGradingResult(rd); setGrading('result'); }
  function toggleTask(id)       { setTasks(ts => ts.map(t => t.id===id ? {...t,done:!t.done} : t)); }
  function reportWrong()        { showToast('反馈已收到'); }
  function showToast(text)      { setToast({text}); setTimeout(() => setToast(null), 2400); }

  async function openHistoryItem(item) {
    if (item.status==='grading') return;
    try {
      const data = await apiGet('/api/grading/'+item.id);
      if (!hasRenderableGrading(data)) { showToast('AI 还在整理结果，稍后再看'); return; }
      const result = mapGradingToResult(data, item.title);
      setCurrentAid(item.id); setGradingResult(result); setGrading('result');
    } catch(_) { showToast('加载失败，请重试'); }
  }

  function pumpAiQueue(aiIdx) {
    const q = streamQueuesRef.current[aiIdx];
    if (!q||q.timer) return;
    q.timer = setInterval(() => {
      const current = streamQueuesRef.current[aiIdx];
      if (!current) { clearInterval(q.timer); return; }
      if (!current.buffer.length) {
        if (current.done) {
          clearInterval(current.timer); delete streamQueuesRef.current[aiIdx];
          setChatMessages(m => m.map(msg => msg._id===aiIdx ? {...msg,streaming:false} : msg));
        }
        return;
      }
      const take = current.buffer.length>24 ? 3 : 1;
      const next = current.buffer.slice(0,take);
      current.buffer = current.buffer.slice(take);
      setChatMessages(m => m.map(msg => msg._id===aiIdx ? {...msg,text:msg.text+next} : msg));
    }, 30);
  }
  function enqueueAiText(aiIdx, text) {
    if (!streamQueuesRef.current[aiIdx]) streamQueuesRef.current[aiIdx]={buffer:'',done:false,timer:null};
    streamQueuesRef.current[aiIdx].buffer += text;
    pumpAiQueue(aiIdx);
  }
  function finishAiStream(aiIdx) {
    if (!streamQueuesRef.current[aiIdx]) streamQueuesRef.current[aiIdx]={buffer:'',done:true,timer:null};
    else streamQueuesRef.current[aiIdx].done = true;
    pumpAiQueue(aiIdx);
  }
  function failAiStream(aiIdx, text) {
    const q = streamQueuesRef.current[aiIdx];
    if (q?.timer) clearInterval(q.timer);
    delete streamQueuesRef.current[aiIdx];
    setChatMessages(m => m.map(msg => msg._id===aiIdx ? {...msg,text,streaming:false} : msg));
  }
  function streamAiMessage(aid, text, aiIdx) {
    fetch('/api/chat/'+aid, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Student-Id':STUDENT_ID},
      body:JSON.stringify({message:text}),
    }).then(resp => {
      if (!resp.ok||!resp.body) throw new Error('chat stream failed');
      const reader = resp.body.getReader(), decoder = new TextDecoder();
      function read() {
        reader.read().then(({done,value}) => {
          if (done) return;
          const chunk = decoder.decode(value,{stream:true});
          chunk.split('\n').forEach(line => {
            if (!line.startsWith('data:')) return;
            const raw = line.slice(5).trim();
            if (raw==='[DONE]') { finishAiStream(aiIdx); return; }
            try {
              const obj = JSON.parse(raw);
              if (obj.err) failAiStream(aiIdx, obj.err);
              else if (obj.t) enqueueAiText(aiIdx, obj.t);
            } catch(_) {}
          });
          read();
        });
      }
      read();
    }).catch(() => { failAiStream(aiIdx,'AI 老师暂时不可用，请稍后再试～'); });
  }

  function sendChatMessage(text) {
    setChatMessages(m => [...m, {role:'user',text}]);
    const aid = currentAid||'general';
    const aiIdx = Date.now();
    setChatMessages(m => [...m, {role:'ai',text:'',_id:aiIdx,streaming:true}]);
    streamAiMessage(aid, text, aiIdx);
  }

  const resultData = gradingResult;

  return (
    <React.Fragment>
      <UserBar/>

      {tab==='home'    && <HomePage onCamera={onCameraClick} messages={chatMessages} onSend={sendChatMessage} onViewResult={onViewResult}/>}
      {tab==='review'  && <ReviewPage tasks={tasks} onToggle={toggleTask}/>}
      {tab==='library' && <PhysicsGraphPage/>}
      {tab==='history' && <HistoryPage items={history} onOpen={openHistoryItem}/>}

      <div style={{
        flex:'0 0 calc(68px + max(12px, env(safe-area-inset-bottom, 0px)))',
        pointerEvents:'none',
      }}/>
      <TabBar value={tab} onChange={setTab}/>

      <input ref={fileInputRef} type="file" accept="image/*"
        style={{display:'none'}} onChange={onFileSelected}/>

      {cropDraft && (
        <CropQuestionScreen
          draft={cropDraft}
          onCancel={cancelCrop}
          onUseWhole={useWholeImage}
          onConfirm={useCroppedImage}
        />
      )}
      {grading==='result' && <ResultScreen data={resultData} onClose={closeResult} onWrong={reportWrong}/>}
      <Toast text={toast?.text}/>
    </React.Fragment>
  );
}

// ═══════════════════════════════════════════════════════════════
// 根容器（响应式，移除 iOS 外框）
// ═══════════════════════════════════════════════════════════════
function Mounted() {
  return (
    <div style={{
      height:'100%',
      minHeight:0,
      background:'var(--surface)',
      display:'flex',
      justifyContent:'center',
      overflow:'hidden',
    }}>
      <div style={{
        width:'100%',
        maxWidth:480,
        height:'100%',
        minHeight:0,
        display:'flex',
        flexDirection:'column',
        background:'#fff',
        position:'relative',
        overflow:'hidden',
        boxShadow:'0 0 0 1px rgba(0,0,0,.04), 0 24px 64px -20px rgba(79,110,247,.08)',
      }}>
        <App/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Mounted/>);
</script>
</body>
</html>
