<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>AI 复习导航</title>
  <style>
    :root {
      --coral: #FF6B5B;
      --coral-light: rgba(255,107,91,0.12);
      --dark: #1F1A14;
      --cream: #FBF7F0;
      --card: #FFFFFF;
      --muted: #8A8580;
      --border: #EDE8E0;
      --green: #34C78A;
      --amber: #F5A623;
      --radius: 16px;
      --shadow: 0 2px 12px rgba(31,26,20,0.08);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; background:var(--cream); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif; color:var(--dark); }

    /* ── Layout ── */
    #app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
    .screen { display:none; flex-direction:column; flex:1; padding:0 0 80px; }
    .screen.active { display:flex; }

    /* ── Top bar ── */
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px; }
    .topbar-title { font-size:18px; font-weight:700; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; cursor:pointer; }

    /* ── Bottom nav ── */
    .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--border); display:flex; z-index:100; }
    .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0 12px; gap:4px; cursor:pointer; color:var(--muted); font-size:10px; font-weight:500; transition:color .15s; }
    .nav-item.active { color:var(--coral); }
    .nav-item svg { width:22px; height:22px; }

    /* ── Cards ── */
    .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin:12px 20px 0; }
    .card-title { font-size:14px; font-weight:600; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:.5px; }

    /* ── Buttons ── */
    .btn { border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; transition:opacity .15s,transform .1s; }
    .btn:active { transform:scale(.97); opacity:.9; }
    .btn-primary { background:var(--coral); color:#fff; padding:16px 24px; width:100%; }
    .btn-outline { background:transparent; border:1.5px solid var(--border); color:var(--dark); padding:12px 20px; }
    .btn-sm { padding:8px 16px; font-size:14px; border-radius:8px; }

    /* ── Hero Upload ── */
    .hero { display:flex; flex-direction:column; align-items:center; padding:40px 20px 24px; gap:16px; }
    .hero-orb { width:120px; height:120px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; position:relative; box-shadow:0 0 0 24px var(--coral-light); }
    .hero-orb span { font-size:44px; font-weight:700; color:#fff; }
    .hero h1 { font-size:26px; font-weight:800; color:var(--dark); text-align:center; margin-top:12px; }
    .hero p { font-size:15px; color:var(--muted); text-align:center; line-height:1.5; }

    /* ── Upload zone ── */
    .upload-zone { margin:0 20px; border:2px dashed var(--border); border-radius:var(--radius); padding:28px; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; transition:border-color .2s,background .2s; background:var(--card); }
    .upload-zone:hover, .upload-zone.drag { border-color:var(--coral); background:var(--coral-light); }
    .upload-zone svg { color:var(--coral); }
    .upload-zone span { font-size:14px; color:var(--muted); }
    #file-input { display:none; }
    #preview-img { max-width:100%; border-radius:10px; margin-top:8px; display:none; }

    /* ── Progress ── */
    .progress-wrap { margin:0 20px; }
    .progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0; }
    .progress-fill { height:100%; background:var(--coral); border-radius:3px; transition:width .4s; }
    .progress-step { display:flex; align-items:center; gap:10px; padding:10px 0; }
    .step-icon { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
    .step-icon.done { background:#E8F8F1; color:var(--green); }
    .step-icon.active { background:var(--coral-light); color:var(--coral); }
    .step-icon.pending { background:var(--border); color:var(--muted); }
    .step-label { font-size:14px; flex:1; }
    .step-label .sub { font-size:12px; color:var(--muted); margin-top:2px; }

    /* ── Tags / Chips ── */
    .tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { padding:6px 12px; border-radius:100px; font-size:13px; font-weight:500; }
    .tag-red { background:#FFE8E6; color:#E03C31; }
    .tag-amber { background:#FEF3E2; color:#C07B1A; }
    .tag-green { background:#E8F8F1; color:#1D9B6C; }

    /* ── Mastery bar ── */
    .mastery-item { margin-bottom:14px; }
    .mastery-label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; }
    .mastery-track { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
    .mastery-fill { height:100%; border-radius:4px; transition:width .6s; }

    /* ── Review plan ── */
    .plan-item { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
    .plan-item:last-child { border-bottom:none; }
    .plan-num { width:32px; height:32px; border-radius:8px; background:var(--coral-light); color:var(--coral); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
    .plan-content { flex:1; }
    .plan-name { font-size:14px; font-weight:600; }
    .plan-meta { font-size:12px; color:var(--muted); margin-top:3px; }
    .plan-priority { padding:3px 8px; border-radius:100px; font-size:11px; font-weight:600; }
    .priority-high { background:#FFE8E6; color:#E03C31; }
    .priority-medium { background:#FEF3E2; color:#C07B1A; }
    .priority-low { background:#E8F8F1; color:#1D9B6C; }

    /* ── Toast ── */
    #toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-80px); background:var(--dark); color:#fff; padding:10px 20px; border-radius:10px; font-size:14px; z-index:999; transition:transform .3s; white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); }

    /* ── Login ── */
    #login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:20px; flex:1; }
    #login-screen h2 { font-size:22px; font-weight:700; }
    .input-wrap { width:100%; }
    .input-wrap label { font-size:13px; font-weight:600; color:var(--muted); display:block; margin-bottom:6px; }
    .input-wrap input { width:100%; padding:14px 16px; border:1.5px solid var(--border); border-radius:12px; font-size:16px; background:var(--card); outline:none; transition:border-color .2s; }
    .input-wrap input:focus { border-color:var(--coral); }

    /* ── Empty states ── */
    .empty { text-align:center; padding:40px 20px; color:var(--muted); }
    .empty svg { margin-bottom:12px; opacity:.4; }
    .empty p { font-size:14px; }

    /* ── Spinner ── */
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--coral); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }

    /* scrollable content area */
    .scroll-area { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

    /* section spacing */
    .section-gap { height:16px; }
  </style>
</head>
<body>
<div id="toast"></div>

<!-- Login -->
<div id="login-screen">
  <div class="hero-orb" style="margin-bottom:8px;"><span>AI</span></div>
  <h2>AI 复习导航</h2>
  <p style="color:var(--muted);font-size:14px;text-align:center">智能分析作业，精准生成复习计划</p>
  <div class="input-wrap" style="margin-top:12px;">
    <label>学生 ID</label>
    <input id="sid-input" type="text" placeholder="请输入学生ID，如 stu_001" autocomplete="username">
  </div>
  <button class="btn btn-primary" onclick="doLogin()">进入系统</button>
</div>

<!-- Main app (hidden until login) -->
<div id="app" style="display:none;">
  <!-- Screen: Upload -->
  <div id="screen-upload" class="screen active">
    <div class="topbar">
      <span class="topbar-title">拍作业</span>
      <div class="avatar" id="avatar-badge">S</div>
    </div>
    <div class="scroll-area">
      <div class="hero" style="padding-top:24px;">
        <div class="hero-orb"><span>AI</span></div>
        <h1>拍照上传作业</h1>
        <p>AI 自动识别错题，归档知识点<br>生成个性化复习计划</p>
      </div>
      <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>点击选择图片 / 拖拽上传</span>
        <span style="font-size:12px">支持 JPG、PNG、HEIC</span>
        <img id="preview-img" alt="预览">
      </div>
      <input type="file" id="file-input" accept="image/*" onchange="onFileSelected(this)">
      <div style="margin:16px 20px 0;">
        <button class="btn btn-primary" id="upload-btn" onclick="doUpload()" disabled>
          开始分析
        </button>
      </div>
      <!-- Processing status (hidden initially) -->
      <div class="card" id="processing-card" style="display:none;">
        <div class="card-title">处理进度</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div id="steps-container"></div>
      </div>
    </div>
  </div>

  <!-- Screen: Profile -->
  <div id="screen-profile" class="screen">
    <div class="topbar">
      <span class="topbar-title">知识档案</span>
      <div class="avatar" id="avatar-badge2">S</div>
    </div>
    <div class="scroll-area">
      <div class="card" id="profile-summary">
        <div class="card-title">掌握概览</div>
        <div id="mastery-bars"></div>
      </div>
      <div class="card">
        <div class="card-title">薄弱知识点</div>
        <div class="tags" id="weak-tags"></div>
      </div>
      <div class="section-gap"></div>
    </div>
  </div>

  <!-- Screen: Review plan -->
  <div id="screen-plan" class="screen">
    <div class="topbar">
      <span class="topbar-title">今日计划</span>
      <button class="btn btn-outline btn-sm" onclick="loadPlan()">刷新</button>
    </div>
    <div class="scroll-area">
      <div class="card">
        <div class="card-title">今日复习任务</div>
        <div id="plan-list"></div>
      </div>
      <div class="section-gap"></div>
    </div>
  </div>

  <!-- Screen: Report -->
  <div id="screen-report" class="screen">
    <div class="topbar">
      <span class="topbar-title">学习报告</span>
    </div>
    <div class="scroll-area">
      <div class="card" id="report-card">
        <div class="card-title">综合报告</div>
        <div id="report-content"><div class="empty"><p>点击下方按钮生成报告</p></div></div>
      </div>
      <div style="margin:12px 20px 0;">
        <button class="btn btn-primary" onclick="loadReport()">生成报告</button>
      </div>
      <div style="margin:12px 20px 0;">
        <button class="btn btn-outline" style="width:100%;" onclick="doExport()">导出 Excel</button>
      </div>
      <div class="section-gap"></div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchScreen('upload',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      拍作业
    </div>
    <div class="nav-item" onclick="switchScreen('profile',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      档案
    </div>
    <div class="nav-item" onclick="switchScreen('plan',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      计划
    </div>
    <div class="nav-item" onclick="switchScreen('report',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      报告
    </div>
  </nav>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let STUDENT_ID = '';
let pollTimer = null;
let selectedFile = null;

// ── API base: same origin ─────────────────────────────────────────────────
const API = '';   // relative — works behind nginx and locally

function headers() {
  return {
    'X-Student-Id': STUDENT_ID,
  };
}

// ── Toast ─────────────────────────────────────────────────────────────────
function toast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── Login ─────────────────────────────────────────────────────────────────
function doLogin() {
  const val = document.getElementById('sid-input').value.trim();
  if (!val) { toast('请输入学生ID'); return; }
  STUDENT_ID = val;
  document.getElementById('avatar-badge').textContent = val[0].toUpperCase();
  document.getElementById('avatar-badge2').textContent = val[0].toUpperCase();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  // pre-load profile and plan
  loadProfile();
  loadPlan();
}

document.getElementById('sid-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ── Screen navigation ─────────────────────────────────────────────────────
function switchScreen(name, navEl) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (navEl) navEl.classList.add('active');
}

// ── File selection ────────────────────────────────────────────────────────
function onFileSelected(input) {
  const file = input.files[0];
  if (!file) return;
  selectedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('preview-img');
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
  document.getElementById('upload-btn').disabled = false;
}

// drag-and-drop
const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const dt = new DataTransfer();
  dt.items.add(file);
  const inp = document.getElementById('file-input');
  inp.files = dt.files;
  onFileSelected(inp);
});

// ── Upload ────────────────────────────────────────────────────────────────
async function doUpload() {
  if (!selectedFile) { toast('请先选择图片'); return; }
  const btn = document.getElementById('upload-btn');
  btn.textContent = '上传中…';
  btn.disabled = true;

  const form = new FormData();
  form.append('file', selectedFile);

  try {
    const res = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: headers(),
      body: form,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || '上传失败 ' + res.status);
    }
    const data = await res.json();
    toast('上传成功，正在分析…');
    showProcessingCard();
    pollStatus(data.assignment_id);
  } catch (e) {
    toast('❌ ' + e.message, 4000);
    btn.textContent = '开始分析';
    btn.disabled = false;
  }
}

// ── Polling ───────────────────────────────────────────────────────────────
const STEPS = [
  { key: 'ocr',      label: 'OCR 文字识别',    sub: '提取题目文字' },
  { key: 'ai',       label: 'AI 错误分析',      sub: '识别错误原因' },
  { key: 'archive',  label: '知识点归档',        sub: '匹配知识体系' },
  { key: 'plan',     label: '生成复习计划',      sub: '个性化推荐' },
];

function showProcessingCard() {
  const card = document.getElementById('processing-card');
  card.style.display = 'block';
  renderSteps({});
}

function renderSteps(status) {
  const container = document.getElementById('steps-container');
  const keys = STEPS.map(s => s.key);
  // Determine progress: find last completed step index
  let doneCount = 0;
  for (const s of STEPS) {
    if (status[s.key] === 'completed' || status[s.key] === 'done') doneCount++;
    else break;
  }
  const pct = Math.round((doneCount / STEPS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  container.innerHTML = STEPS.map(s => {
    const st = status[s.key];
    let iconClass = 'pending', icon = '○';
    if (st === 'completed' || st === 'done') { iconClass = 'done'; icon = '✓'; }
    else if (st === 'processing' || st === 'running') { iconClass = 'active'; icon = '⟳'; }
    return `<div class="progress-step">
      <div class="step-icon ${iconClass}">${icon}</div>
      <div class="step-label">
        ${s.label}
        <div class="sub">${s.sub}</div>
      </div>
    </div>`;
  }).join('');
}

function pollStatus(taskId) {
  if (!taskId) { toast('任务ID缺失，请重试'); return; }
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(API + '/api/assignments/' + taskId, { headers: headers() });
      if (!res.ok) return;
      const data = await res.json();

      const procStatus = data.processing_status || {};
      renderSteps(procStatus);

      const overall = data.status || data.assignment_status || '';
      if (overall === 'completed' || overall === 'done') {
        clearInterval(pollTimer);
        document.getElementById('upload-btn').textContent = '开始分析';
        document.getElementById('upload-btn').disabled = false;
        toast('✅ 分析完成！');
        loadProfile();
        loadPlan();
      } else if (overall === 'failed' || overall === 'error') {
        clearInterval(pollTimer);
        toast('❌ 分析失败，请重试', 4000);
        document.getElementById('upload-btn').textContent = '开始分析';
        document.getElementById('upload-btn').disabled = false;
      }
    } catch {}
  }, 3000);
}

// ── Profile ────────────────────────────────────────────────────────────────
async function loadProfile() {
  try {
    const [profileRes, weakRes] = await Promise.all([
      fetch(API + '/api/students/' + STUDENT_ID + '/profile', { headers: headers() }),
      fetch(API + '/api/students/' + STUDENT_ID + '/weak-points', { headers: headers() }),
    ]);

    if (profileRes.ok) {
      const profile = await profileRes.json();
      renderMasteryBars(profile.knowledge_mastery || profile.mastery || []);
    }
    if (weakRes.ok) {
      const weak = await weakRes.json();
      renderWeakTags(weak.weak_points || weak || []);
    }
  } catch {}
}

function masteryColor(score) {
  if (score >= 0.8) return '#34C78A';
  if (score >= 0.5) return '#F5A623';
  return '#FF6B5B';
}

function renderMasteryBars(items) {
  const el = document.getElementById('mastery-bars');
  if (!items.length) {
    el.innerHTML = '<div class="empty"><p>暂无数据，请先上传作业</p></div>';
    return;
  }
  el.innerHTML = items.slice(0, 8).map(item => {
    const name = item.knowledge_point_name || item.name || item.topic || '未知';
    const score = typeof item.mastery_score === 'number' ? item.mastery_score
                : typeof item.score === 'number' ? item.score : 0;
    const pct = Math.round(score * 100);
    const color = masteryColor(score);
    return `<div class="mastery-item">
      <div class="mastery-label"><span>${name}</span><span style="color:${color};font-weight:600">${pct}%</span></div>
      <div class="mastery-track"><div class="mastery-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');
}

function renderWeakTags(items) {
  const el = document.getElementById('weak-tags');
  if (!items.length) {
    el.innerHTML = '<div class="empty"><p>暂无薄弱知识点</p></div>';
    return;
  }
  el.innerHTML = items.slice(0, 12).map(item => {
    const name = item.knowledge_point_name || item.name || item.topic || String(item);
    const score = typeof item.mastery_score === 'number' ? item.mastery_score
                : typeof item.score === 'number' ? item.score : 0;
    const cls = score < 0.4 ? 'tag-red' : score < 0.65 ? 'tag-amber' : 'tag-green';
    return `<span class="tag ${cls}">${name}</span>`;
  }).join('');
}

// ── Plan ──────────────────────────────────────────────────────────────────
async function loadPlan() {
  const el = document.getElementById('plan-list');
  el.innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner"></div></div>';
  try {
    const res = await fetch(API + '/api/students/' + STUDENT_ID + '/review-tasks', { headers: headers() });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const items = data.review_items || data.tasks || data.plans || data || [];
    renderPlanList(Array.isArray(items) ? items : []);
  } catch (e) {
    el.innerHTML = '<div class="empty"><p>暂无复习计划<br>请先上传作业</p></div>';
  }
}

function renderPlanList(items) {
  const el = document.getElementById('plan-list');
  if (!items.length) {
    el.innerHTML = '<div class="empty"><p>今日没有复习任务</p></div>';
    return;
  }
  el.innerHTML = items.map((item, i) => {
    const name = item.knowledge_point_name || item.name || item.topic || `任务 ${i+1}`;
    const priority = item.priority || 'medium';
    const priCls = priority === 'high' ? 'priority-high' : priority === 'low' ? 'priority-low' : 'priority-medium';
    const priLabel = priority === 'high' ? '重点' : priority === 'low' ? '一般' : '中等';
    const minutes = item.estimated_minutes || item.duration || '';
    return `<div class="plan-item">
      <div class="plan-num">${i+1}</div>
      <div class="plan-content">
        <div class="plan-name">${name}</div>
        <div class="plan-meta">${minutes ? '约 ' + minutes + ' 分钟' : ''} ${item.description || item.reason || ''}</div>
      </div>
      <span class="plan-priority ${priCls}">${priLabel}</span>
    </div>`;
  }).join('');
}

// ── Report ────────────────────────────────────────────────────────────────
async function loadReport() {
  const el = document.getElementById('report-content');
  el.innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner"></div></div>';
  try {
    const res = await fetch(API + '/api/reports/student/' + STUDENT_ID, { headers: headers() });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    renderReport(data);
  } catch (e) {
    el.innerHTML = '<div class="empty"><p>生成报告失败，请稍后重试</p></div>';
    toast('❌ 报告加载失败', 3000);
  }
}

function renderReport(data) {
  const el = document.getElementById('report-content');
  const summary = data.summary || data.report_summary || '';
  const totalPts = data.total_knowledge_points || data.knowledge_points_count || 0;
  const masteredPts = data.mastered_knowledge_points || data.mastered_count || 0;
  const avgMastery = data.average_mastery_score != null
    ? Math.round(data.average_mastery_score * 100) + '%'
    : data.avg_mastery != null ? Math.round(data.avg_mastery * 100) + '%' : '—';

  el.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
      ${stat('知识点', totalPts)}
      ${stat('已掌握', masteredPts)}
      ${stat('平均掌握', avgMastery)}
    </div>
    ${summary ? `<p style="font-size:14px;line-height:1.7;color:var(--dark)">${summary}</p>` : ''}
  `;
}

function stat(label, value) {
  return `<div style="background:var(--cream);border-radius:10px;padding:12px;text-align:center;">
    <div style="font-size:22px;font-weight:700;color:var(--coral)">${value}</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">${label}</div>
  </div>`;
}

// ── Export ────────────────────────────────────────────────────────────────
async function doExport() {
  try {
    const res = await fetch(API + '/api/export/student/' + STUDENT_ID + '/knowledge-points', { headers: headers() });
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = STUDENT_ID + '_report.xlsx'; a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    toast('❌ 导出失败', 3000);
  }
}
</script>
