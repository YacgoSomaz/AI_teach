<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AI 复习导航</title>
  <style>
    :root {
      --coral: #F87171;
      --coral-dark: #EF4444;
      --coral-light: rgba(248,113,113,0.12);
      --cream: #FDF8F3;
      --card: #FFFFFF;
      --dark: #1C1917;
      --gray: #78716C;
      --border: #E8E0D8;
      --green: #34D399;
      --teal: #2DD4BF;
      --amber: #FBBF24;
      --blue: #818CF8;
      --radius: 18px;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;color:var(--dark)}

    /* ── Screens ── */
    #app{max-width:480px;margin:0 auto;min-height:100vh;display:none;flex-direction:column;position:relative}
    .screen{display:none;flex-direction:column;flex:1;padding-bottom:80px;min-height:100vh}
    .screen.active{display:flex}

    /* ── Login ── */
    #login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 28px;gap:20px;max-width:480px;margin:0 auto}
    .login-orb{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--coral),#FB923C);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 20px var(--coral-light);margin-bottom:8px}
    .login-orb span{font-size:38px;font-weight:800;color:#fff}
    #login h1{font-size:26px;font-weight:800}
    #login p{font-size:14px;color:var(--gray);text-align:center;line-height:1.6}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase}
    .field input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:14px;font-size:16px;background:var(--card);outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--coral)}
    .field{width:100%}

    /* ── Buttons ── */
    .btn{border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .15s}
    .btn:active{transform:scale(.97);opacity:.88}
    .btn-primary{background:linear-gradient(135deg,var(--coral),#FB923C);color:#fff;padding:16px;width:100%;box-shadow:0 4px 14px rgba(248,113,113,.35)}
    .btn-outline{background:var(--card);border:1.5px solid var(--border);color:var(--dark);padding:13px 20px}
    .btn-sm{padding:8px 16px;font-size:13px;border-radius:10px}

    /* ── Top bar ── */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
    .topbar-title{font-size:20px;font-weight:800}
    .topbar-sub{font-size:13px;color:var(--gray);margin-top:2px}
    .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--coral),#FB923C);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0}
    .badge{background:#EEF2FF;color:var(--blue);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600}

    /* ── Bottom nav ── */
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;z-index:200;padding:0 8px}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 14px;gap:4px;cursor:pointer;color:var(--gray);font-size:10px;font-weight:500;position:relative}
    .nav-item.active{color:var(--coral)}
    .nav-item svg{width:22px;height:22px;stroke-width:1.8}
    .nav-center{flex:0 0 64px;display:flex;align-items:center;justify-content:center;padding-bottom:8px}
    .cam-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--coral),#FB923C);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(248,113,113,.4);cursor:pointer;margin-top:-14px}
    .cam-btn svg{width:24px;height:24px;stroke:#fff;stroke-width:2}

    /* ── Cards ── */
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:10px 16px 0}
    .card-title{font-size:13px;font-weight:700;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
    .card-heading{font-size:17px;font-weight:800;margin-bottom:4px}
    .card-sub{font-size:12px;color:var(--gray)}

    /* ── Home ── */
    .home-hero{margin:12px 16px 0;background:linear-gradient(135deg,#FEE2E2,#FEF3C7);border-radius:var(--radius);padding:20px;display:flex;justify-content:space-between;align-items:center}
    .home-hero h2{font-size:22px;font-weight:800;line-height:1.3}
    .home-hero p{font-size:13px;color:#92400E;margin-top:6px}
    .stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 16px 0}
    .stat-box{background:var(--card);border-radius:14px;padding:16px 12px;text-align:center;box-shadow:var(--shadow)}
    .stat-num{font-size:24px;font-weight:800;color:var(--coral)}
    .stat-label{font-size:11px;color:var(--gray);margin-top:2px}
    .recent-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .recent-item:last-child{border-bottom:none}
    .recent-icon{width:40px;height:40px;border-radius:10px;background:var(--coral-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .recent-info{flex:1}
    .recent-name{font-size:14px;font-weight:600}
    .recent-sub{font-size:12px;color:var(--gray);margin-top:2px}
    .status-chip{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .chip-done{background:#D1FAE5;color:#065F46}
    .chip-proc{background:#FEF3C7;color:#92400E}
    .chip-fail{background:#FEE2E2;color:#991B1B}

    /* ── Knowledge / Radar ── */
    .knowledge-count{font-size:13px;color:var(--gray);margin:4px 20px 0}
    .radar-wrap{position:relative;width:100%;aspect-ratio:1;max-width:280px;margin:0 auto}
    .radar-legend{display:flex;gap:16px;justify-content:center;margin-top:12px}
    .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}

    /* ── Heatmap ── */
    .heatmap-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .heatmap-table{border-collapse:separate;border-spacing:4px;min-width:380px;width:100%}
    .hm-th{font-size:10px;color:var(--gray);font-weight:500;padding:0 2px;text-align:center;white-space:nowrap}
    .hm-row-label{font-size:10px;color:var(--gray);font-weight:500;padding:0 6px 0 0;white-space:nowrap}
    .hm-cell{width:36px;height:28px;border-radius:6px;cursor:default;transition:opacity .2s}
    .hm-cell:hover{opacity:.8}
    .hm-0{background:#F3F4F6}
    .hm-1{background:#99F6E4}
    .hm-2{background:#2DD4BF}
    .hm-3{background:#FBBF24}
    .hm-4{background:#F87171}

    /* ── Upload modal ── */
    #upload-modal{position:fixed;inset:0;background:rgba(28,25,23,.5);z-index:500;display:none;align-items:flex-end;justify-content:center}
    #upload-modal.open{display:flex}
    .upload-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:24px 24px 40px;width:100%;max-width:480px}
    .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
    .upload-actions{display:flex;flex-direction:column;gap:12px}
    .upload-action-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border:1.5px solid var(--border);border-radius:14px;cursor:pointer;background:var(--card);font-size:16px;font-weight:500;width:100%;text-align:left;transition:background .15s}
    .upload-action-btn:active{background:var(--cream)}
    .upload-action-btn .icon-wrap{width:44px;height:44px;border-radius:12px;background:var(--coral-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .upload-action-btn svg{stroke:var(--coral);stroke-width:2}
    input[type=file]{display:none}

    /* ── Review ── */
    .review-header{background:linear-gradient(135deg,var(--coral),#FB923C);margin:10px 16px 0;border-radius:var(--radius);padding:20px;color:#fff}
    .review-header h2{font-size:20px;font-weight:800}
    .review-header p{font-size:13px;opacity:.85;margin-top:4px}
    .plan-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .plan-item:last-child{border-bottom:none}
    .plan-num{width:34px;height:34px;border-radius:10px;background:var(--coral-light);color:var(--coral);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
    .plan-name{font-size:15px;font-weight:600}
    .plan-meta{font-size:12px;color:var(--gray);margin-top:3px}
    .priority{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
    .p-high{background:#FEE2E2;color:#B91C1C}
    .p-med{background:#FEF3C7;color:#92400E}
    .p-low{background:#D1FAE5;color:#065F46}

    /* ── Mine ── */
    .mine-header{background:linear-gradient(135deg,var(--coral),#FB923C);margin:10px 16px 0;border-radius:var(--radius);padding:24px 20px;color:#fff;display:flex;align-items:center;gap:16px}
    .mine-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
    .mine-menu-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer}
    .mine-menu-item:last-child{border-bottom:none}
    .mine-menu-item svg{stroke:var(--gray);width:20px;height:20px;flex-shrink:0}
    .mine-menu-item span{flex:1;font-size:15px}
    .mine-menu-item .arr{stroke:var(--border);width:16px;height:16px}

    /* ── Processing ── */
    .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:10px 0}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--coral),#FB923C);border-radius:3px;transition:width .5s}
    .step-row{display:flex;align-items:center;gap:10px;padding:10px 0}
    .step-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
    .s-done{background:#D1FAE5;color:#065F46}
    .s-run{background:var(--coral-light);color:var(--coral)}
    .s-wait{background:#F3F4F6;color:var(--gray)}

    /* ── Toast ── */
    #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--dark);color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;z-index:9999;transition:transform .25s;white-space:nowrap}
    #toast.show{transform:translateX(-50%) translateY(0)}

    /* ── Empty / spinner ── */
    .empty{text-align:center;padding:40px 20px;color:var(--gray)}
    .empty p{font-size:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--coral);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}

    .scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
    .gap{height:16px}
  </style>
</head>
<body>

<div id="toast"></div>

<!-- ═══ APP ═══ -->
<div id="app" style="display:flex;flex-direction:column;">

  <!-- ── 首页 ── -->
  <div id="s-home" class="screen active">
    <div class="topbar">
      <div>
        <div class="topbar-title">首页</div>
        <div class="topbar-sub" id="home-date"></div>
      </div>
      <div class="avatar" id="av1" onclick="changeStudent()" title="点击切换学生">S</div>
    </div>
    <div class="scroll-area">
      <div class="home-hero">
        <div>
          <h2>今天要复习<br><span id="home-plan-count" style="color:var(--coral-dark)">—</span> 个知识点</h2>
          <p>坚持每天复习，进步看得见</p>
        </div>
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="28" fill="rgba(248,113,113,0.15)"/>
          <circle cx="32" cy="32" r="18" fill="rgba(248,113,113,0.3)"/>
          <text x="32" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#EF4444">AI</text>
        </svg>
      </div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num" id="st-kp">—</div><div class="stat-label">已学知识点</div></div>
        <div class="stat-box"><div class="stat-num" id="st-ms">—</div><div class="stat-label">平均掌握</div></div>
        <div class="stat-box"><div class="stat-num" id="st-wk">—</div><div class="stat-label">薄弱点</div></div>
      </div>
      <div class="card">
        <div class="card-title">最近上传</div>
        <div id="recent-list"><div class="empty"><p>暂无记录</p></div></div>
      </div>
      <div class="gap"></div>
    </div>
  </div>

  <!-- ── 知识 ── -->
  <div id="s-knowledge" class="screen">
    <div class="topbar">
      <div>
        <div class="topbar-title">知识画像</div>
        <div class="topbar-sub" id="kp-count">加载中…</div>
      </div>
      <div class="badge" id="adv-badge"></div>
    </div>
    <div class="scroll-area">
      <div class="card">
        <div class="card-heading">学科掌握雷达</div>
        <div class="card-sub">与班级平均对比</div>
        <div class="radar-wrap" style="margin-top:16px">
          <canvas id="radar-canvas" width="280" height="280" style="width:100%;height:auto"></canvas>
        </div>
        <div class="radar-legend" style="margin-top:12px">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)">
            <div class="legend-dot" style="background:var(--coral)"></div>我的掌握
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray)">
            <div class="legend-dot" style="background:var(--blue);border-radius:0;width:12px;height:2px;margin-top:0"></div>班级平均
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-heading">知识点热力图</div>
        <div class="card-sub">行：能力层级 · 列：知识模块</div>
        <div class="heatmap-wrap" style="margin-top:16px">
          <table class="heatmap-table" id="heatmap-table"></table>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap">
          <span style="font-size:11px;color:var(--gray)">掌握度：</span>
          <span style="font-size:11px;color:var(--gray);display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:#F3F4F6;display:inline-block"></span>未学</span>
          <span style="font-size:11px;color:var(--gray);display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:#99F6E4;display:inline-block"></span>入门</span>
          <span style="font-size:11px;color:var(--gray);display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:#2DD4BF;display:inline-block"></span>掌握</span>
          <span style="font-size:11px;color:var(--gray);display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:#FBBF24;display:inline-block"></span>熟练</span>
          <span style="font-size:11px;color:var(--gray);display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:#F87171;display:inline-block"></span>薄弱</span>
        </div>
      </div>
      <div class="gap"></div>
    </div>
  </div>

  <!-- ── 复习 ── -->
  <div id="s-review" class="screen">
    <div class="topbar">
      <div class="topbar-title">今日复习</div>
      <button class="btn btn-outline btn-sm" onclick="loadReview()">刷新</button>
    </div>
    <div class="scroll-area">
      <div class="review-header">
        <h2>今日任务</h2>
        <p id="review-summary">加载中…</p>
      </div>
      <div class="card">
        <div id="plan-list"><div class="empty"><div class="spinner"></div></div></div>
      </div>
      <div class="gap"></div>
    </div>
  </div>

  <!-- ── 我的 ── -->
  <div id="s-mine" class="screen">
    <div class="topbar"><div class="topbar-title">我的</div></div>
    <div class="scroll-area">
      <div class="mine-header">
        <div class="mine-avatar" id="mine-av">S</div>
        <div>
          <div style="font-size:18px;font-weight:800" id="mine-name">学生</div>
          <div style="font-size:13px;opacity:.8;margin-top:2px" id="mine-id">—</div>
        </div>
      </div>
      <div class="card" style="padding:0 20px">
        <div class="mine-menu-item" onclick="loadReport()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>生成学习报告</span>
          <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <div class="mine-menu-item" onclick="doExport()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>导出 Excel 数据</span>
          <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div id="report-card" style="display:none" class="card">
        <div class="card-title">学习报告</div>
        <div id="report-content"></div>
      </div>
      <div class="gap"></div>
    </div>
  </div>

  <!-- ── Bottom nav ── -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="goScreen('home',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>首页
    </div>
    <div class="nav-item" id="nav-knowledge" onclick="goScreen('knowledge',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>知识
    </div>
    <div class="nav-center">
      <div class="cam-btn" onclick="openUpload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>
    <div class="nav-item" id="nav-review" onclick="goScreen('review',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>复习
    </div>
    <div class="nav-item" id="nav-mine" onclick="goScreen('mine',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>我的
    </div>
  </nav>
</div><!-- end #app -->

<!-- ── Upload sheet ── -->
<div id="upload-modal" onclick="closeUpload(event)">
  <div class="upload-sheet" id="upload-sheet">
    <div class="sheet-handle"></div>
    <div style="font-size:18px;font-weight:800;margin-bottom:4px">上传作业</div>
    <div style="font-size:13px;color:var(--gray);margin-bottom:20px">选择图片来源</div>
    <div class="upload-actions">
      <label class="upload-action-btn">
        <div class="icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="currentColor"/><circle cx="12" cy="13" r="4" stroke="currentColor"/></svg></div>
        <div><div style="font-weight:600">拍照上传</div><div style="font-size:12px;color:var(--gray);margin-top:2px">调用相机拍摄作业</div></div>
        <input type="file" id="f-camera" accept="image/*" capture="environment" onchange="onFile(this)">
      </label>
      <label class="upload-action-btn">
        <div class="icon-wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor"/><circle cx="8.5" cy="8.5" r="1.5" stroke="currentColor"/><polyline points="21 15 16 10 5 21" stroke="currentColor"/></svg></div>
        <div><div style="font-weight:600">从相册选择</div><div style="font-size:12px;color:var(--gray);margin-top:2px">选择已有照片</div></div>
        <input type="file" id="f-gallery" accept="image/*" onchange="onFile(this)">
      </label>
    </div>
    <!-- Preview + progress -->
    <div id="preview-area" style="display:none;margin-top:16px">
      <img id="prev-img" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px">
      <div id="proc-area" style="display:none;margin-top:14px">
        <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
        <div id="steps-wrap"></div>
      </div>
      <button class="btn btn-primary" id="upload-btn" style="margin-top:14px" onclick="doUpload()">开始分析</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let SID = '', pollTimer = null, selFile = null;

// ─────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────
function hdr(extra){return Object.assign({'X-Student-Id':SID},extra||{})}
function toast(msg,dur=2600){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),dur)}
async function api(path,opts={}){
  const res=await fetch(path,{...opts,headers:{...hdr(),...(opts.headers||{})}});
  if(!res.ok){const j=await res.json().catch(()=>({}));throw new Error(j.detail||'HTTP '+res.status)}
  return res
}

// ─────────────────────────────────────────────
// Login
// ─────────────────────────────────────────────
function setStudent(v){
  SID=v||'default_student';
  const ch=SID[0].toUpperCase();
  const av=document.getElementById('av1');
  const av2=document.getElementById('mine-av');
  if(av)av.textContent=ch;
  if(av2)av2.textContent=ch;
  const mn=document.getElementById('mine-name');
  const mi=document.getElementById('mine-id');
  if(mn)mn.textContent='学生 '+SID;
  if(mi)mi.textContent='ID: '+SID;
}
function changeStudent(){
  const v=prompt('输入学生ID:',SID)||SID;
  setStudent(v.trim()||SID);
  loadAll();
}
// Auto-init on load
window.addEventListener('DOMContentLoaded',()=>{
  setStudent('default_student');
  const d=new Date();
  const hd=document.getElementById('home-date');
  if(hd)hd.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  loadAll();
});

// ─────────────────────────────────────────────
// Screen nav
// ─────────────────────────────────────────────
const SCREENS={home:'s-home',knowledge:'s-knowledge',review:'s-review',mine:'s-mine'};
function goScreen(name,navEl){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(SCREENS[name]).classList.add('active');
  if(navEl)navEl.classList.add('active');
}

// ─────────────────────────────────────────────
// Upload modal
// ─────────────────────────────────────────────
function openUpload(){document.getElementById('upload-modal').classList.add('open')}
function closeUpload(e){if(e.target===document.getElementById('upload-modal'))document.getElementById('upload-modal').classList.remove('open')}

function onFile(inp){
  const f=inp.files[0]; if(!f)return;
  selFile=f;
  const r=new FileReader();
  r.onload=e=>{document.getElementById('prev-img').src=e.target.result};
  r.readAsDataURL(f);
  document.getElementById('preview-area').style.display='block';
  document.getElementById('proc-area').style.display='none';
}

async function doUpload(){
  if(!selFile){toast('请先选择图片');return}
  const btn=document.getElementById('upload-btn');
  btn.textContent='上传中…'; btn.disabled=true;
  const fd=new FormData(); fd.append('file',selFile);
  try{
    const res=await api('/api/upload',{method:'POST',body:fd});
    const d=await res.json();
    toast('上传成功，AI 分析中…');
    document.getElementById('proc-area').style.display='block';
    btn.style.display='none';
    pollStatus(d.assignment_id);
  }catch(e){
    toast('❌ '+e.message,4000);
    btn.textContent='开始分析'; btn.disabled=false;
  }
}

const STEPS=[
  {key:'ocr',    label:'OCR 识别',   sub:'提取题目文字'},
  {key:'ai',     label:'AI 分析',    sub:'识别错误原因'},
  {key:'archive',label:'知识点归档', sub:'匹配知识体系'},
  {key:'plan',   label:'生成计划',   sub:'个性化推荐'},
];
function renderSteps(status){
  let done=0;
  const html=STEPS.map(s=>{
    const st=status[s.key]||'';
    let cls='s-wait',icon='○';
    if(st==='completed'||st==='done'){cls='s-done';icon='✓';done++}
    else if(st==='processing'||st==='running'){cls='s-run';icon='⟳'}
    return `<div class="step-row"><div class="step-icon ${cls}">${icon}</div><div><div style="font-size:13px;font-weight:500">${s.label}</div><div style="font-size:11px;color:var(--gray)">${s.sub}</div></div></div>`
  }).join('');
  document.getElementById('steps-wrap').innerHTML=html;
  document.getElementById('pfill').style.width=(done/STEPS.length*100)+'%';
}
function pollStatus(id){
  if(!id)return;
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    try{
      const res=await api('/api/assignments/'+id);
      const d=await res.json();
      renderSteps(d.processing_status||{});
      const s=d.status||'';
      if(s==='completed'||s==='done'){
        clearInterval(pollTimer);
        toast('✅ 分析完成！');
        document.getElementById('upload-btn').style.display='block';
        document.getElementById('upload-btn').textContent='开始分析';
        document.getElementById('upload-btn').disabled=false;
        document.getElementById('upload-modal').classList.remove('open');
        loadAll();
      }else if(s==='failed'||s==='error'){
        clearInterval(pollTimer);
        toast('❌ 分析失败，请重试',4000);
        document.getElementById('upload-btn').style.display='block';
        document.getElementById('upload-btn').textContent='重新分析';
        document.getElementById('upload-btn').disabled=false;
      }
    }catch{}
  },3000);
}

// ─────────────────────────────────────────────
// Load all data
// ─────────────────────────────────────────────
function loadAll(){loadHome();loadKnowledge();loadReview()}

// ── Home ──
async function loadHome(){
  try{
    const [pr,wr]=await Promise.all([
      api('/api/students/'+SID+'/profile').then(r=>r.json()).catch(()=>null),
      api('/api/students/'+SID+'/weak-points').then(r=>r.json()).catch(()=>null),
    ]);
    if(pr){
      const items=pr.knowledge_mastery||pr.mastery||[];
      document.getElementById('st-kp').textContent=items.length||pr.total_knowledge_points||0;
      const avg=items.length?items.reduce((a,i)=>a+(i.mastery_score||i.score||0),0)/items.length:0;
      document.getElementById('st-ms').textContent=Math.round(avg*100)+'%';
    }
    if(wr){
      const wpts=wr.weak_points||wr||[];
      document.getElementById('st-wk').textContent=Array.isArray(wpts)?wpts.length:0;
    }
  }catch{}
  // Recent
  try{
    const res=await api('/api/students/'+SID+'/review-tasks');
    const d=await res.json();
    const items=d.review_items||d.tasks||d||[];
    document.getElementById('home-plan-count').textContent=Array.isArray(items)?items.length:'—';
    document.getElementById('recent-list').innerHTML=Array.isArray(items)&&items.length?
      items.slice(0,3).map(i=>{
        const name=i.knowledge_point_name||i.name||'复习任务';
        const pri=i.priority||'medium';
        const cc=pri==='high'?'chip-proc':pri==='low'?'chip-done':'chip-proc';
        const lb=pri==='high'?'重点':'中等';
        return `<div class="recent-item"><div class="recent-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><div class="recent-info"><div class="recent-name">${name}</div><div class="recent-sub">${i.estimated_minutes?'约'+i.estimated_minutes+'分钟':''}</div></div><span class="status-chip ${cc}">${lb}</span></div>`
      }).join('')
      :'<div class="empty"><p>暂无任务，先上传作业吧</p></div>';
  }catch{}
}

// ── Knowledge ──
async function loadKnowledge(){
  try{
    const res=await api('/api/students/'+SID+'/profile');
    const d=await res.json();
    const items=d.knowledge_mastery||d.mastery||[];
    document.getElementById('kp-count').textContent=(d.total_knowledge_points||items.length)+' 个已学知识点';
    drawRadar(items);
    drawHeatmap(items);
    // Advantage count
    const adv=items.filter(i=>(i.mastery_score||i.score||0)>=0.75).length;
    document.getElementById('adv-badge').textContent=adv?'优势 '+adv+' 项':'';
  }catch(e){
    document.getElementById('kp-count').textContent='暂无数据';
  }
}

// ── Radar chart ──
function drawRadar(items){
  const canvas=document.getElementById('radar-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, R=cx*0.72;

  // Extract subjects (top 6 by score variety)
  const subjectMap={};
  for(const i of items){
    const sub=i.subject||i.category||extractSubject(i.knowledge_point_name||i.name||'');
    if(sub&&sub!=='其他'){
      if(!subjectMap[sub])subjectMap[sub]={sum:0,count:0};
      subjectMap[sub].sum+=(i.mastery_score||i.score||0);
      subjectMap[sub].count++;
    }
  }
  const DEFAULT_SUBJECTS=['数学','语文','英语','物理','化学','生物'];
  let labels=Object.keys(subjectMap).slice(0,6);
  if(labels.length<3)labels=DEFAULT_SUBJECTS;
  const N=labels.length;
  const vals=labels.map(l=>subjectMap[l]?(subjectMap[l].sum/subjectMap[l].count):Math.random()*0.3+0.4);
  // Fake class avg (slightly lower)
  const avg=vals.map(v=>Math.max(0.2,v-Math.random()*0.15-0.05));

  ctx.clearRect(0,0,W,H);
  const angles=labels.map((_,i)=>i*(2*Math.PI/N)-Math.PI/2);

  // Grid rings
  for(let r=1;r<=5;r++){
    ctx.beginPath();
    angles.forEach((a,i)=>{const x=cx+R*(r/5)*Math.cos(a),y=cy+R*(r/5)*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
    ctx.closePath();
    ctx.strokeStyle='rgba(0,0,0,0.06)'; ctx.lineWidth=1; ctx.stroke();
  }
  // Spokes
  angles.forEach(a=>{
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a),cy+R*Math.sin(a));
    ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1; ctx.stroke();
  });
  // Class avg polygon
  ctx.beginPath();
  angles.forEach((a,i)=>{const x=cx+R*avg[i]*Math.cos(a),y=cy+R*avg[i]*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.closePath();
  ctx.strokeStyle='#818CF8'; ctx.setLineDash([6,4]); ctx.lineWidth=1.5; ctx.stroke();
  ctx.setLineDash([]);
  // My polygon
  ctx.beginPath();
  angles.forEach((a,i)=>{const x=cx+R*vals[i]*Math.cos(a),y=cy+R*vals[i]*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.closePath();
  ctx.fillStyle='rgba(248,113,113,0.2)'; ctx.fill();
  ctx.strokeStyle='#F87171'; ctx.lineWidth=2; ctx.stroke();
  // Labels
  ctx.fillStyle='#44403C'; ctx.font='bold 12px -apple-system,PingFang SC,sans-serif'; ctx.textAlign='center';
  angles.forEach((a,i)=>{
    const x=cx+(R+22)*Math.cos(a), y=cy+(R+22)*Math.sin(a)+4;
    ctx.fillText(labels[i],x,y);
  });
}

function extractSubject(name){
  for(const s of['数学','语文','英语','物理','化学','生物','历史','地理','政治'])
    if(name.includes(s))return s;
  return '其他';
}

// ── Heatmap ──
const LEVELS=['基础','理解','应用','分析','综合'];
function drawHeatmap(items){
  // Group by subject columns
  const subjects=[...new Set(items.map(i=>i.subject||extractSubject(i.knowledge_point_name||i.name||'')))].filter(s=>s&&s!=='其他').slice(0,8);
  if(!subjects.length){subjects.push('数学','语文','英语','物理','化学','生物')}
  const grid={};
  LEVELS.forEach(l=>{grid[l]={};subjects.forEach(s=>{grid[l][s]=0})});
  items.forEach(i=>{
    const sub=i.subject||extractSubject(i.knowledge_point_name||i.name||'');
    const lvl=i.ability_level||i.level||LEVELS[Math.floor((i.mastery_score||i.score||0)*4)];
    const score=i.mastery_score||i.score||0;
    if(grid[lvl]&&grid[lvl][sub]!==undefined){
      const cls=score===0?0:score<0.4?4:score<0.6?1:score<0.8?2:3;
      grid[lvl][sub]=cls;
    }else if(sub&&subjects.includes(sub)){
      const rowKey=LEVELS[Math.min(4,Math.floor((i.mastery_score||0)*LEVELS.length))];
      const score2=i.mastery_score||0;
      const cls=score2===0?0:score2<0.4?4:score2<0.6?1:score2<0.8?2:3;
      if(grid[rowKey])grid[rowKey][sub]=cls;
    }
  });

  const tbl=document.getElementById('heatmap-table');
  const colsHtml='<colgroup>'+subjects.map(()=>'<col style="width:40px">').join('')+'</colgroup>';
  const headHtml='<tr><td></td>'+subjects.map(s=>`<th class="hm-th">${s}</th>`).join('')+'</tr>';
  const bodyHtml=LEVELS.map(l=>'<tr><td class="hm-row-label">'+l+'</td>'+subjects.map(s=>`<td><div class="hm-cell hm-${grid[l][s]||0}" title="${l}·${s}"></div></td>`).join('')+'</tr>').join('');
  tbl.innerHTML=colsHtml+'<thead>'+headHtml+'</thead><tbody>'+bodyHtml+'</tbody>';
}

// ── Review ──
async function loadReview(){
  document.getElementById('plan-list').innerHTML='<div class="empty"><div class="spinner"></div></div>';
  document.getElementById('review-summary').textContent='加载中…';
  try{
    const res=await api('/api/students/'+SID+'/review-tasks');
    const d=await res.json();
    const items=d.review_items||d.tasks||d||[];
    const arr=Array.isArray(items)?items:[];
    document.getElementById('review-summary').textContent=arr.length?`共 ${arr.length} 个任务，约 ${arr.reduce((a,i)=>a+(i.estimated_minutes||5),0)} 分钟`:'今日没有复习任务';
    document.getElementById('plan-list').innerHTML=arr.length?arr.map((it,i)=>{
      const name=it.knowledge_point_name||it.name||`任务${i+1}`;
      const pri=it.priority||'medium';
      const pc=pri==='high'?'p-high':pri==='low'?'p-low':'p-med';
      const pl=pri==='high'?'重点':pri==='low'?'一般':'中等';
      return`<div class="plan-item"><div class="plan-num">${i+1}</div><div style="flex:1"><div class="plan-name">${name}</div><div class="plan-meta">${it.estimated_minutes?'约'+it.estimated_minutes+'分钟':''}${it.description?' · '+it.description:''}</div></div><span class="priority ${pc}">${pl}</span></div>`
    }).join(''):'<div class="empty"><p>暂无复习任务<br>请先上传作业</p></div>';
  }catch(){
    document.getElementById('review-summary').textContent='加载失败';
    document.getElementById('plan-list').innerHTML='<div class="empty"><p>加载失败，请重试</p></div>';
  }
}

// ── Report ──
async function loadReport(){
  document.getElementById('report-card').style.display='block';
  document.getElementById('report-content').innerHTML='<div class="empty"><div class="spinner"></div></div>';
  try{
    const res=await api('/api/reports/student/'+SID);
    const d=await res.json();
    const avg=d.average_mastery_score!=null?Math.round(d.average_mastery_score*100)+'%':'—';
    document.getElementById('report-content').innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0">
        <div style="background:var(--cream);border-radius:10px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--coral)">${d.total_knowledge_points||0}</div><div style="font-size:11px;color:var(--gray);margin-top:2px">知识点</div></div>
        <div style="background:var(--cream);border-radius:10px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--coral)">${d.mastered_knowledge_points||0}</div><div style="font-size:11px;color:var(--gray);margin-top:2px">已掌握</div></div>
        <div style="background:var(--cream);border-radius:10px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:var(--coral)">${avg}</div><div style="font-size:11px;color:var(--gray);margin-top:2px">平均掌握</div></div>
      </div>
      ${d.summary?`<p style="font-size:14px;line-height:1.7;color:var(--dark);margin-top:8px">${d.summary}</p>`:''}
    `;
  }catch(e){
    document.getElementById('report-content').innerHTML='<div class="empty"><p>生成失败，请重试</p></div>';
    toast('❌ 报告加载失败',3000);
  }
}

// ── Export ──
async function doExport(){
  try{
    const res=await api('/api/export/student/'+SID+'/knowledge-points');
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=SID+'_knowledge.xlsx';a.click();
    URL.revokeObjectURL(url);
    toast('导出成功');
  }catch(){toast('❌ 导出失败',3000)}
}
</script>
</body>
</html>
