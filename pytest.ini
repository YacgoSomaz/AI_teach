[pytest]
# pytest-asyncio 配置
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试发现
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
